name: CleanFleet search hint only
on:
  push:
    paths:
      - '.github/workflows/cleanfleet-search-hint-only.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply placeholder-only change
        run: |
          python3 .github/scripts/patch_search_hint_only.py
          git diff --check
          CHANGED=$(git diff --name-only)
          test "$CHANGED" = "app/index.html"
      - name: Commit only placeholder change
        run: |
          git config user.name 'robisie'
          git config user.email 'robisie-fer@o2.pl'
          git add app/index.html
          git commit -m 'ui: mention multi-plate search in search hint'
          git rm .github/scripts/patch_search_hint_only.py .github/workflows/cleanfleet-search-hint-only.yml
          git commit --amend --no-edit
          git push
