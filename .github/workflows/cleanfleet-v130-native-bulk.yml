name: CleanFleet v1.30 native bulk search
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanfleet-v130-native-bulk.yml'
      - '.github/scripts/patch_v130_native2.py'
      - '.github/scripts/native_bulk_v130.jsfrag'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch_v130_native2.py
      - name: Show diff
        run: git diff -- app/index.html app/sw.js
      - name: Commit and push
        run: |
          git config user.name robisie
          git config user.email robisie-fer@o2.pl
          git add app/index.html app/sw.js
          git commit -m "fix: make v1.30 bulk plate search native"
          git push origin main
