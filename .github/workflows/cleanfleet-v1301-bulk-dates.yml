name: CleanFleet v1.30.1 bulk dates
on:
  push:
    paths:
      - '.github/workflows/cleanfleet-v1301-bulk-dates.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply targeted patch
        run: python3 .github/scripts/patch_v1301_bulk_dates.py
      - name: Show diff
        run: git diff --check && git diff -- app/index.html app/sw.js
      - name: Commit and push
        run: |
          git config user.name robisie
          git config user.email robisie-fer@o2.pl
          git add app/index.html app/sw.js
          git commit -m "feat: bulk order dates before adding washes"
          git push origin main
