name: CleanFleet bulk dates overlay layer fix
on:
  push:
    paths:
      - '.github/workflows/cleanfleet-v1303-overlay.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply targeted overlay fix
        run: python3 .github/scripts/patch_v1303_bulk_overlay.py
      - name: Validate
        run: |
          git diff --check
          grep -n "cfBulkDatesOverlay\|zIndex='100000'" app/index.html | head -10
      - name: Commit and clean temporary files
        run: |
          rm .github/scripts/patch_v1303_bulk_overlay.py
          rm .github/workflows/cleanfleet-v1303-overlay.yml
          git config user.name robisie
          git config user.email robisie-fer@o2.pl
          git add app/index.html .github/scripts/patch_v1303_bulk_overlay.py .github/workflows/cleanfleet-v1303-overlay.yml
          git commit -m "fix: show bulk order details above search modal"
          git push origin main
