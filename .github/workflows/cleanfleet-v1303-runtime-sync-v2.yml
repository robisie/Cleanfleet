name: CleanFleet v1.30.3 runtime sync v2
on:
  push:
    paths:
      - '.github/workflows/cleanfleet-v1303-runtime-sync-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply corrected runtime sync fix
        run: python3 .github/scripts/patch_v1303_runtime_sync_v3.py
      - name: Validate production files
        run: |
          git diff --check
          grep -n "Wersja aplikacji: v1.30.3" app/index.html app/sw.js app/admin-dashboard-v1270.js
          grep -n "sw.js?v=20260917-1303\|admin-dashboard-v1270.js?v=20260917-12" app/index.html app/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('app/index.html').read_text()
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',html,re.I)
          for i,b in enumerate(blocks):
              if not b.strip(): continue
              p=Path(f'/tmp/cf-{i}.js'); p.write_text(b); subprocess.run(['node','--check',str(p)],check=True)
          subprocess.run(['node','--check','app/admin-dashboard-v1270.js'],check=True)
          subprocess.run(['node','--check','app/sw.js'],check=True)
          PY
      - name: Commit production fix and clean temporary files
        run: |
          rm -f .github/scripts/patch_v1303_runtime_sync.py
          rm -f .github/scripts/patch_v1303_runtime_sync_v2.py
          rm -f .github/scripts/patch_v1303_runtime_sync_v3.py
          rm -f .github/workflows/cleanfleet-v1303-runtime-sync.yml
          rm -f .github/workflows/cleanfleet-v1303-runtime-sync-v2.yml
          git config user.name robisie
          git config user.email robisie-fer@o2.pl
          git add app/index.html app/sw.js app/admin-dashboard-v1270.js .github/scripts .github/workflows
          git commit -m "v1.30.3 synchronize Safari and PWA runtime"
          git push origin main
