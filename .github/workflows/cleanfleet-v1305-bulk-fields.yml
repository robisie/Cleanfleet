name: CleanFleet v1.30.5 bulk order fields
on:
  push:
    paths:
      - '.github/workflows/cleanfleet-v1305-bulk-fields.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply bulk order fields patch
        run: python3 .github/scripts/patch_v1305_bulk_fields.py
      - name: Validate JavaScript
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('app/index.html').read_text()
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',html,re.I)
          for i,b in enumerate(blocks):
              if not b.strip(): continue
              p=Path(f'/tmp/cf-{i}.js')
              p.write_text(b)
              subprocess.run(['node','--check',str(p)],check=True)
          subprocess.run(['node','--check','app/admin-dashboard-v1270.js'],check=True)
          subprocess.run(['node','--check','app/sw.js'],check=True)
          PY
          grep -n "cfBulkOrderedBy\|cfBulkCost\|ordered_by:orderedBy\|cost:cost\|v1.30.5" app/index.html app/sw.js app/admin-dashboard-v1270.js
      - name: Commit production patch
        run: |
          rm -f .github/scripts/patch_v1305_bulk_fields.py
          rm -f .github/workflows/cleanfleet-v1305-bulk-fields.yml
          git config user.name robisie
          git config user.email robisie-fer@o2.pl
          git add app/index.html app/sw.js app/admin-dashboard-v1270.js .github/scripts .github/workflows
          git commit -m "v1.30.5 add orderer and cost to bulk wash creation"
          git push origin main
