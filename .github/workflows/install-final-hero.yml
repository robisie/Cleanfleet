name: Install final CleanFleet hero image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-final-hero.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hero asset
        shell: bash
        run: |
          cat .github/tmp/hero.part1 .github/tmp/hero.part2 .github/tmp/hero.part3 .github/tmp/hero.part4 | base64 -d > assets/cleanfleet-hero-trucks-square.webp
          test "$(wc -c < assets/cleanfleet-hero-trucks-square.webp)" -gt 15000
          file assets/cleanfleet-hero-trucks-square.webp | grep -qi webp
      - name: Patch public site
        shell: bash
        run: |
          echo '' | base64 -d | python3
          grep -q 'cleanfleet-hero-trucks-square.webp' index2.html
      - name: Commit final hero
        shell: bash
        run: |
          git config user.name 'CleanFleet Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/tmp/hero.part1 .github/tmp/hero.part2 .github/tmp/hero.part3 .github/tmp/hero.part4 .github/workflows/install-final-hero.yml
          git add assets/cleanfleet-hero-trucks-square.webp index2.html
          git commit -m 'Public site: install final square hero image'
          git push
