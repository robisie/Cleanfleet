name: Install CleanFleet public hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-public-hero.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild hero image
        shell: bash
        run: |
          mkdir -p assets
          cat .github/tmp/hero.part1 .github/tmp/hero.part2 .github/tmp/hero.part3 .github/tmp/hero.part4 | base64 -d > assets/cleanfleet-hero-trucks-square.webp
          test $(stat -c%s assets/cleanfleet-hero-trucks-square.webp) -gt 15000

      - name: Patch public page only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index2.html')
          s = p.read_text(encoding='utf-8')
          old = 'src="assets/v2-start.webp" alt="Czerwony ciągnik na parkingu floty"'
          new = 'src="assets/cleanfleet-hero-trucks-square.webp" alt="Flota ciężarówek MAN, Renault Trucks, Scania, Mercedes-Benz i Volvo"'
          if old not in s and 'assets/cleanfleet-hero-trucks-square.webp' not in s:
              raise SystemExit('Nie znaleziono obrazu hero do podmiany')
          s = s.replace(old, new, 1)
          marker = '/* CleanFleet square hero */'
          css = '''\n    /* CleanFleet square hero */\n    .start .photo{object-fit:cover;object-position:center center}\n    @media (orientation:portrait){.start .photo{object-position:center center}}\n    @media (orientation:landscape){.start .photo{object-position:center center}}\n'''
          if marker not in s:
              s = s.replace('</style>\n</head>', css + '  </style>\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          grep -q 'assets/cleanfleet-hero-trucks-square.webp' index2.html
          grep -q 'assets/v2-problem.webp' index2.html
          grep -q 'assets/v2-solution.webp' index2.html
          grep -q 'assets/v2-services.webp' index2.html
          grep -q 'assets/v2-fleet.webp' index2.html
          grep -q 'assets/v2-contact.webp' index2.html
          test $(stat -c%s assets/cleanfleet-hero-trucks-square.webp) -gt 15000

      - name: Commit final change and clean temporary files
        shell: bash
        run: |
          git config user.name 'CleanFleet Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/install-public-hero.yml
          git rm -r .github/tmp
          git add index2.html assets/cleanfleet-hero-trucks-square.webp
          git commit -m 'Public site: use square multi-brand hero image'
          git push
