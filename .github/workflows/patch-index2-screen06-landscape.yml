name: CleanFleet public screen 06 landscape patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-index2-screen06-landscape.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index2.html screen 06 landscape
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index2.html')
          s = p.read_text(encoding='utf-8')
          tag = '/* screen 06 landscape layout */'
          patch = "\n/* screen 06 landscape layout */\n@media (min-width:801px) and (orientation:landscape){.system-head{left:7vw;top:10vh;width:min(560px,40vw);z-index:3}.system-head .tag{display:flex;align-items:center;justify-content:flex-start;gap:10px}.system-head .tag span{float:none!important}.system-head h2{font-size:clamp(38px,4.7vw,76px);margin:12px 0 10px}.steps{left:7vw;right:auto;top:39vh;width:min(420px,32vw);display:grid;grid-template-columns:1fr;gap:18px;z-index:3}.step{display:grid;grid-template-columns:58px 1fr;gap:15px;align-items:center;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.09)}.step:last-child{border-bottom:0}.step i{width:54px;height:54px;margin:0}.step p{display:block;margin:5px 0 0}.dashboard{left:auto;right:-15vw;top:17vh;bottom:auto;transform:none;width:72vw;max-width:none;height:70vh;z-index:2;perspective:1100px}.dashboard>.device-float{width:100%;height:100%}.device-art{width:100%;height:100%}}\n"
          if tag not in s:
              marker = '</style>\n</head>'
              if marker not in s:
                  raise SystemExit('style marker not found')
              s = s.replace(marker, patch + '</style>\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify patch
        shell: bash
        run: |
          grep -q 'screen 06 landscape layout' index2.html
          grep -q 'right:-15vw' index2.html
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'CleanFleet Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-index2-screen06-landscape.yml
          git add index2.html
          git commit -m 'Public site: redesign screen 06 landscape layout'
          git push
