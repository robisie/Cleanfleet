name: CleanFleet public visual refinements
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-index2-visual-details.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index2
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          grep -q -- '--g:#B6C433' index2.html
          grep -q 'Powered by' index2.html
          grep -q 'RENAULT TRUCKS' index2.html
          grep -q 'class="service-list"' index2.html
          grep -q 'contact-signature' index2.html
      - name: Commit
        run: |
          git config user.name 'CleanFleet Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-index2-visual-details.yml
          git add index2.html
          git commit -m 'Public site: align visuals with CleanFleet concept'
          git push
