name: CleanFleet patch mobile tiles v1.18.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-mobile-tiles-v1188.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app/index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('v1.18.7 beta', 'v1.18.8 beta').replace('CleanFleet v1.18.7', 'CleanFleet v1.18.8')
          patch = r'''
          /* v1.18.8 — równe kafelki narzędzi na widoku mobilnym */
          @media (max-width:850px){
            .cf-company-grid{
              grid-template-columns:repeat(2,minmax(0,1fr)) !important;
              gap:9px !important;
            }
            .cf-company-utility-card{
              grid-column:span 1 !important;
              width:100% !important;
              min-width:0 !important;
              max-width:100% !important;
              box-sizing:border-box !important;
              justify-self:stretch !important;
            }
            .cf-company-utility-card > div{
              min-width:0 !important;
              width:100% !important;
            }
            .cf-company-card:not(.cf-company-utility-card){
              grid-column:1 / -1 !important;
            }
          }
          @media (max-width:600px){
            .cf-company-grid{
              grid-template-columns:repeat(2,minmax(0,1fr)) !important;
            }
            .cf-company-utility-card{
              min-height:92px !important;
              padding:12px !important;
            }
          }
          '''
          marker = '</style>\n<button type="button" id="cfChatFab"'
          if '/* v1.18.8 — równe kafelki narzędzi na widoku mobilnym */' not in s:
              if marker in s:
                  s = s.replace(marker, patch + '\n</style>\n<button type="button" id="cfChatFab"', 1)
              else:
                  s = s.replace('</head>', '<style>' + patch + '</style>\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify patch
        shell: bash
        run: |
          grep -q 'v1.18.8 beta' app/index.html
          grep -q 'v1.18.8 — równe kafelki narzędzi na widoku mobilnym' app/index.html
      - name: Commit app update and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'CleanFleet Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-mobile-tiles-v1188.yml
          git add app/index.html
          git commit -m 'CleanFleet v1.18.8 beta: equal mobile dashboard tiles'
          git push
