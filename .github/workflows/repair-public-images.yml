name: Repair CleanFleet public images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-public-images.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore working hero and image rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index2.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('src="assets/cleanfleet-hero-trucks-square.jpg" alt="Flota ciężarówek MAN, Renault Trucks, Scania, Mercedes-Benz i Volvo"','src="assets/v2-start.webp" alt="Czerwony ciągnik na parkingu floty"',1)
          s=re.sub(r'\n\s*/\* Hero — kwadratowe zdjęcie 1:1, pełny ekran \*/.*?@media \(orientation:landscape\)\{\s*\.start \.photo\{object-position:50% 60%;\}\s*\}\s*','\n',s,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify all existing image references
        shell: bash
        run: |
          grep -q 'assets/v2-start.webp' index2.html
          grep -q 'assets/v2-problem.webp' index2.html
          grep -q 'assets/v2-solution.webp' index2.html
          grep -q 'assets/v2-services.webp' index2.html
          grep -q 'assets/v2-fleet.webp' index2.html
          grep -q 'assets/v2-contact.webp' index2.html
          test -s assets/v2-start.webp
          test -s assets/v2-problem.webp
          test -s assets/v2-solution.webp
          test -s assets/v2-services.webp
          test -s assets/v2-fleet.webp
          test -s assets/v2-contact.webp
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'CleanFleet Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/repair-public-images.yml
          git add index2.html
          git commit -m 'Public site: restore working image set'
          git push
