<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101412">
<title>CleanFleet Calendar</title>
<style>
:root{--bg:#0e1210;--panel:#161c18;--panel2:#1c2420;--panel3:#222b26;--line:#2b352f;--text:#f3f7f4;--muted:#91a098;--green:#48a868;--green2:#75c58d;--blue:#4aa3df;--amber:#dda84e;--red:#d76565;--violet:#9b82db}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#0d110f,#121814 50%,#0d110f);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}.app{max-width:1600px;margin:0 auto;padding:16px 16px 40px}.topbar{display:flex;align-items:center;gap:10px}.topbar .brand{flex:1;text-align:center}.brand strong{display:block;font-size:19px}.brand span{font-size:11px;color:var(--muted)}.btn{border:1px solid var(--line);background:#161c18;color:var(--text);border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:#21472e;border-color:#356e46;color:#dff7e7}.btn.danger{color:#ffc0c0}.toolbar{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;margin:16px 0}.nav,.views,.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.views .btn.active{background:#254b31;border-color:#3d7650}.range{font-size:17px;font-weight:900;text-align:center}.filters select,.filters input{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:40px}.summary{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin-bottom:12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px}.stat span{font-size:10px;color:var(--muted);display:block}.stat strong{font-size:22px;display:block;margin-top:3px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}.calendar{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}.week-head{display:grid;grid-template-columns:repeat(7,1fr);background:#131814;border-bottom:1px solid var(--line)}.week-head div{padding:10px;text-align:center;color:var(--muted);font-size:10px;font-weight:900}.month-grid{display:grid;grid-template-columns:repeat(7,1fr)}.day-cell{min-height:145px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;position:relative;background:rgba(255,255,255,.008)}.day-cell:nth-child(7n){border-right:0}.day-cell.out{opacity:.36}.day-cell.today{box-shadow:inset 0 0 0 1px var(--green)}.day-cell.dragover{background:#223a2a}.day-top{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;margin-bottom:5px}.day-num{font-size:12px;font-weight:900}.day-weather{font-size:10px;color:var(--muted);white-space:nowrap}.events{display:grid;gap:4px}.event{border:1px solid var(--line);background:var(--panel2);border-left:4px solid var(--green);border-radius:8px;padding:5px 6px;cursor:pointer;min-width:0}.event.wash{border-left-color:var(--green)}.event.reminder{border-left-color:var(--violet)}.event.overdue{border-left-color:var(--red)}.event.payment{border-left-color:var(--amber)}.event strong{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event small{display:block;font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}.more{font-size:9px;color:var(--muted);padding:2px}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(160px,1fr));overflow-x:auto}.week-col{min-height:600px;border-right:1px solid var(--line);padding:8px}.week-col:last-child{border-right:0}.week-col.today{background:rgba(72,168,104,.045)}.week-title{font-size:12px;font-weight:900;margin-bottom:3px}.week-weather{font-size:10px;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px}.week-events{display:grid;gap:7px}.week-events .event{padding:8px}.week-events .event strong{font-size:12px}.week-events .event small{font-size:9px}.day-view{padding:14px}.day-hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:14px;background:var(--panel2);border:1px solid var(--line);border-radius:15px;margin-bottom:12px}.day-hero h2{margin:0;font-size:22px}.day-hero p{margin:5px 0 0;color:var(--muted);font-size:11px}.day-events{display:grid;gap:8px}.day-events .event{padding:11px}.day-events .event strong{font-size:14px}.day-events .event small{font-size:10px}.side{display:grid;gap:12px;align-content:start}.side-card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px}.side-card h3{font-size:13px;margin:0 0 10px}.side-list{display:grid;gap:7px;max-height:320px;overflow:auto}.side-item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px}.side-item strong{font-size:11px;display:block}.side-item small{font-size:9px;color:var(--muted);display:block;margin-top:2px}.side-item.red{border-left:4px solid var(--red)}.side-item.amber{border-left:4px solid var(--amber)}.side-item.green{border-left:4px solid var(--green)}.empty{color:var(--muted);font-size:11px;padding:14px;text-align:center}.loading{min-height:70vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:800}.hidden{display:none!important}.modal-bg{position:fixed;inset:0;z-index:200000;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px}.modal{width:min(520px,96vw);max-height:90vh;overflow:auto;background:#171e1a;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 60px #0009}.modal h2{font-size:18px;margin:0 0 12px}.form{display:grid;gap:10px}.field label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;background:#101512;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.field textarea{min-height:85px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900;background:#263029;color:#b8c7be}.badge.red{background:#3e2323;color:#ffc0c0}.badge.green{background:#203b29;color:#a9e6bb}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300000;background:#111814;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:11px;font-weight:800;box-shadow:0 10px 30px #0008}.mobile-tabs{display:none}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(3,1fr)}.summary{grid-template-columns:repeat(5,1fr)}}
@media(max-width:760px){.app{padding:10px 8px 28px}.topbar .brand strong{font-size:15px}.topbar .brand span{display:none}.toolbar{grid-template-columns:1fr;gap:8px}.range{order:-1;font-size:16px}.nav,.views,.filters{justify-content:center}.summary{grid-template-columns:repeat(2,1fr)}.stat:last-child{grid-column:span 2}.layout{display:block}.side{display:grid;grid-template-columns:1fr;margin-top:10px}.calendar{border-radius:15px}.week-head div{padding:7px 1px;font-size:9px}.day-cell{min-height:105px;padding:4px}.day-weather{font-size:8px}.event{padding:4px}.event strong{font-size:8.5px}.event small{display:none}.more{font-size:8px}.week-grid{grid-template-columns:repeat(7,140px)}.week-col{min-height:480px}.form-row{grid-template-columns:1fr}.filters input{width:100%}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="btn" id="backBtn">← CleanFleet</button>
    <div class="brand"><strong>CleanFleet Calendar</strong><span>plan pracy · terminy · przypomnienia · pogoda</span></div>
    <button class="btn primary" id="addReminder">＋ Przypomnienie</button>
  </header>

  <div id="loading" class="loading">Ładuję kalendarz CleanFleet…</div>
  <main id="content" class="hidden">
    <div class="toolbar">
      <div class="nav"><button class="btn" id="prev">←</button><button class="btn" id="today">Dziś</button><button class="btn" id="next">→</button></div>
      <div class="views"><button class="btn active" data-view="month">Miesiąc</button><button class="btn" data-view="week">Tydzień</button><button class="btn" data-view="day">Dzień</button></div>
      <div class="range" id="rangeTitle">—</div>
      <div><button class="btn" id="refresh">Odśwież</button></div>
    </div>

    <div class="filters">
      <select id="companyFilter"><option value="">Wszystkie firmy</option></select>
      <select id="eventFilter"><option value="all">Wszystko</option><option value="wash">Zlecenia</option><option value="reminder">Przypomnienia</option></select>
      <input id="search" type="search" placeholder="Szukaj: tablica, firma, przypomnienie…">
    </div>

    <section class="summary" id="summary"></section>

    <div class="layout">
      <section class="calendar">
        <div class="week-head" id="weekHead"><div>PON</div><div>WT</div><div>ŚR</div><div>CZW</div><div>PT</div><div>SOB</div><div>ND</div></div>
        <div id="calendarBody"></div>
      </section>
      <aside class="side">
        <section class="side-card"><h3>Najbliższe terminy</h3><div class="side-list" id="upcoming"></div></section>
        <section class="side-card"><h3>Pojazdy po terminie 183 dni</h3><div class="side-list" id="ageOver"></div></section>
        <section class="side-card"><h3>Zbliżają się do 183 dni</h3><div class="side-list" id="ageSoon"></div></section>
      </aside>
    </div>
  </main>
</div>
<div id="modalHost"></div><div id="toastHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app/calendar-engine.js?v=20260917-1"></script>
<script src="/app/weather-engine.js?v=20260917-1"></script>
<script>
(()=>{
'use strict';
let data=null,weather=null,view='month',cursor=new Date(),dragId=null;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const localDay=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDay=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d,12)};
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12);
const mon=d=>add(d,-((d.getDay()||7)-1));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(d,o={day:'2-digit',month:'2-digit'})=>d.toLocaleDateString('pl-PL',o);
const effReminderDate=r=>CFCalendarEngine.isoDay(r.due_at||((r.status==='snoozed'&&r.snoozed_until)?r.snoozed_until:r.remind_at));
const companyName=id=>data?.companyMap?.get(String(id))?.short_name||data?.companyMap?.get(String(id))?.name||'Firma';
function toast(t){const h=$('toastHost');h.innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>{h.innerHTML=''},2200)}
function wday(date){return weather?.daily?.find(x=>x.date===date)||null}
function weatherHtml(date){const w=wday(date);return w?`${w.icon} ${Math.round(w.tmax??0)}° <span style="color:#4aa3df">${w.pop??0}%</span>`:''}
function reminderClass(r,date){if(r.is_payment)return'payment';const today=localDay(new Date());return date<today&& !['done','cancelled'].includes(r.status)?'overdue':''}
function allEvents(){
  if(!data)return[];
  const c=$('companyFilter').value,q=$('search').value.trim().toLowerCase(),kind=$('eventFilter').value;
  const washes=data.planned.map(r=>({kind:'wash',date:r.date,id:r.id,company_id:r.company_id,title:upperPlate(r.plate),sub:`${companyName(r.company_id)}${r.type?' · '+r.type:''}`,raw:r}));
  const rem=data.reminders.filter(r=>!['done','cancelled'].includes(r.status)).map(r=>({kind:'reminder',date:effReminderDate(r),id:r.id,company_id:r.company_id,title:r.title||'Przypomnienie',sub:[r.company_id?companyName(r.company_id):'',r.vehicle_plate||'',r.payee||''].filter(Boolean).join(' · '),raw:r})).filter(x=>x.date);
  return [...washes,...rem].filter(e=>{
    if(c&&String(e.company_id||'')!==c)return false;
    if(kind!=='all'&&e.kind!==kind)return false;
    if(q&&!`${e.title} ${e.sub}`.toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>a.date.localeCompare(b.date)||a.kind.localeCompare(b.kind));
}
function upperPlate(v){return String(v||'').toUpperCase()}
function eventHtml(e){const cls=e.kind==='wash'?'wash':`reminder ${reminderClass(e.raw,e.date)}`;const drag=e.kind==='wash'?'draggable="true"':'';return `<div class="event ${cls}" data-kind="${e.kind}" data-id="${esc(e.id)}" ${drag}><strong>${e.kind==='wash'?'🚚 ':'🔔 '}${esc(e.title)}</strong><small>${esc(e.sub)}</small></div>`}
function renderSummary(events){const today=localDay(new Date()),weekEnd=localDay(add(new Date(),7));const todayN=events.filter(e=>e.date===today).length;const next7=events.filter(e=>e.date>=today&&e.date<=weekEnd).length;const washes=events.filter(e=>e.kind==='wash').length;const rem=events.filter(e=>e.kind==='reminder').length;const overdue=data.ageing.filter(x=>x.status==='overdue').length;$('summary').innerHTML=[["Dzisiaj",todayN],["Najbliższe 7 dni",next7],["Zlecenia",washes],["Przypomnienia",rem],["Po 183 dniach",overdue]].map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}
function rangeTitle(){if(view==='month')return cursor.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});if(view==='week'){const s=mon(cursor);return `${fmt(s)} – ${fmt(add(s,6))}`;}return cursor.toLocaleDateString('pl-PL',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
function renderMonth(events){$('weekHead').classList.remove('hidden');const first=new Date(cursor.getFullYear(),cursor.getMonth(),1,12),start=mon(first),today=localDay(new Date());let h='<div class="month-grid">';for(let i=0;i<42;i++){const d=add(start,i),ds=localDay(d),list=events.filter(e=>e.date===ds),out=d.getMonth()!==cursor.getMonth();h+=`<div class="day-cell ${out?'out':''} ${ds===today?'today':''}" data-date="${ds}"><div class="day-top"><span class="day-num">${d.getDate()}</span><span class="day-weather">${weatherHtml(ds)}</span></div><div class="events">${list.slice(0,4).map(eventHtml).join('')}${list.length>4?`<div class="more">+ ${list.length-4} więcej</div>`:''}</div></div>`}h+='</div>';$('calendarBody').innerHTML=h}
function renderWeek(events){$('weekHead').classList.add('hidden');const s=mon(cursor),today=localDay(new Date());let h='<div class="week-grid">';for(let i=0;i<7;i++){const d=add(s,i),ds=localDay(d),list=events.filter(e=>e.date===ds);h+=`<div class="week-col ${ds===today?'today':''}" data-date="${ds}"><div class="week-title">${d.toLocaleDateString('pl-PL',{weekday:'long',day:'2-digit',month:'2-digit'})}</div><div class="week-weather">${weatherHtml(ds)||'Brak prognozy'}</div><div class="week-events">${list.length?list.map(eventHtml).join(''):'<div class="empty">Brak wpisów</div>'}</div></div>`}h+='</div>';$('calendarBody').innerHTML=h}
function renderDay(events){$('weekHead').classList.add('hidden');const ds=localDay(cursor),list=events.filter(e=>e.date===ds),w=wday(ds);$('calendarBody').innerHTML=`<div class="day-view" data-date="${ds}"><div class="day-hero"><div><h2>${cursor.toLocaleDateString('pl-PL',{weekday:'long',day:'2-digit',month:'long'})}</h2><p>${list.length} pozycji w kalendarzu</p></div><div style="text-align:right;font-size:15px;font-weight:900">${w?`${w.icon} ${Math.round(w.tmax)}° / ${Math.round(w.tmin)}°<br><span style="font-size:10px;color:#91a098">opady ${w.rain} mm · pewność ${w.confidence}%</span>`:''}</div></div><div class="day-events">${list.length?list.map(eventHtml).join(''):'<div class="empty">Brak zleceń i przypomnień na ten dzień.</div>'}</div></div>`}
function renderSide(events){const today=localDay(new Date()),future=events.filter(e=>e.date>=today).slice(0,18);$('upcoming').innerHTML=future.length?future.map(e=>`<div class="side-item ${e.kind==='wash'?'green':''}"><strong>${e.date.split('-').reverse().join('.')} · ${esc(e.title)}</strong><small>${esc(e.sub||e.kind)}</small></div>`).join(''):'<div class="empty">Brak najbliższych terminów.</div>';const over=data.ageing.filter(x=>x.status==='overdue').slice(0,30),soon=data.ageing.filter(x=>x.status==='soon').sort((a,b)=>a.daysToLimit-b.daysToLimit).slice(0,30);$('ageOver').innerHTML=over.length?over.map(x=>`<div class="side-item red"><strong>${esc(upperPlate(x.plate))} · ${x.days} dni</strong><small>${esc(companyName(x.company_id))} · ostatnie ${x.lastWash.split('-').reverse().join('.')}</small></div>`).join(''):'<div class="empty">Brak pojazdów po terminie.</div>';$('ageSoon').innerHTML=soon.length?soon.map(x=>`<div class="side-item amber"><strong>${esc(upperPlate(x.plate))} · za ${x.daysToLimit} dni</strong><small>${esc(companyName(x.company_id))} · ${x.days} dni od prania</small></div>`).join(''):'<div class="empty">Brak pojazdów w ciągu 14 dni.</div>'}
function bindCalendar(){const body=$('calendarBody');body.querySelectorAll('.event').forEach(el=>el.addEventListener('click',()=>openEvent(el.dataset.kind,el.dataset.id)));body.querySelectorAll('.event[draggable="true"]').forEach(el=>el.addEventListener('dragstart',e=>{dragId=el.dataset.id;e.dataTransfer?.setData('text/plain',dragId)}));body.querySelectorAll('[data-date]').forEach(cell=>{cell.addEventListener('dragover',e=>{if(dragId){e.preventDefault();cell.classList.add('dragover')}});cell.addEventListener('dragleave',()=>cell.classList.remove('dragover'));cell.addEventListener('drop',async e=>{cell.classList.remove('dragover');e.preventDefault();const id=dragId||e.dataTransfer?.getData('text/plain');dragId=null;if(!id)return;try{await CFCalendarEngine.moveWash(id,cell.dataset.date);toast('Termin przeniesiony.');await load(false)}catch(err){console.error(err);toast('Nie udało się przenieść terminu.')}});cell.addEventListener('dblclick',()=>{cursor=parseDay(cell.dataset.date);view='day';syncViewButtons();render()})})}
function render(){if(!data)return;const events=allEvents();$('rangeTitle').textContent=rangeTitle();renderSummary(events);if(view==='month')renderMonth(events);else if(view==='week')renderWeek(events);else renderDay(events);renderSide(events);bindCalendar()}
function syncViewButtons(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function openEvent(kind,id){if(kind==='wash'){const r=data.planned.find(x=>String(x.id)===String(id));if(!r)return;showInfo('Zlecenie',`<div class="form"><div><span class="badge green">ZLECENIE</span></div><div><b style="font-size:22px">${esc(upperPlate(r.plate))}</b></div><div>${esc(companyName(r.company_id))}</div><div>Termin: <b>${r.date.split('-').reverse().join('.')}</b></div><div>Typ: ${esc(r.type||'—')}</div><div style="color:#91a098;font-size:11px">Termin możesz zmienić przeciągając zlecenie na inny dzień.</div></div>`);return}const r=data.reminders.find(x=>String(x.id)===String(id));if(r)showReminder(r)}
function showInfo(title,html){$('modalHost').innerHTML=`<div class="modal-bg"><div class="modal"><h2>${esc(title)}</h2>${html}<div class="actions"><button class="btn" data-close>Zamknij</button></div></div></div>`;$('modalHost').querySelector('[data-close]').onclick=()=>{$('modalHost').innerHTML=''}}
function showReminder(r){const date=effReminderDate(r);$('modalHost').innerHTML=`<div class="modal-bg"><div class="modal"><h2>${esc(r.title||'Przypomnienie')}</h2><div class="form"><div><span class="badge ${date<localDay(new Date())?'red':''}">${esc(r.status||'active')}</span></div><div>Termin: <b>${date?date.split('-').reverse().join('.'):'—'}</b></div>${r.company_id?`<div>Firma: ${esc(companyName(r.company_id))}</div>`:''}${r.vehicle_plate?`<div>Pojazd: ${esc(upperPlate(r.vehicle_plate))}</div>`:''}${r.amount?`<div>Kwota: ${Number(r.amount).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})} zł</div>`:''}${r.notes?`<div style="white-space:pre-wrap;color:#c5cec8">${esc(r.notes)}</div>`:''}</div><div class="actions"><button class="btn" data-snooze>Odłóż 24 h</button><button class="btn primary" data-done>Wykonane</button><button class="btn danger" data-del>Usuń</button><button class="btn" data-close>Zamknij</button></div></div></div>`;const host=$('modalHost');host.querySelector('[data-close]').onclick=()=>host.innerHTML='';host.querySelector('[data-done]').onclick=async()=>{try{await CFCalendarEngine.setReminderStatus(r.id,'done');host.innerHTML='';await load(false)}catch(e){toast('Nie udało się zapisać.')}};host.querySelector('[data-snooze]').onclick=async()=>{try{await CFCalendarEngine.snoozeReminder(r.id,24);host.innerHTML='';await load(false)}catch(e){toast('Nie udało się odłożyć.')}};host.querySelector('[data-del]').onclick=async()=>{if(!confirm('Usunąć przypomnienie?'))return;try{await CFCalendarEngine.deleteReminder(r.id);host.innerHTML='';await load(false)}catch(e){toast('Nie udało się usunąć.')}}}
function reminderForm(){const companies=data?.companies||[];$('modalHost').innerHTML=`<div class="modal-bg"><div class="modal"><h2>Nowe przypomnienie</h2><div class="form"><div class="field"><label>Tytuł</label><input id="rfTitle" autofocus></div><div class="form-row"><div class="field"><label>Data</label><input id="rfDate" type="date" value="${localDay(cursor)}"></div><div class="field"><label>Godzina</label><input id="rfTime" type="time" value="09:00"></div></div><div class="field"><label>Firma</label><select id="rfCompany"><option value="">Bez firmy</option>${companies.map(c=>`<option value="${esc(c.id)}">${esc(c.short_name||c.name)}</option>`).join('')}</select></div><div class="form-row"><div class="field"><label>Tablica</label><input id="rfPlate"></div><div class="field"><label>Priorytet</label><select id="rfPriority"><option value="normal">Normalny</option><option value="high">Wysoki</option><option value="low">Niski</option></select></div></div><div class="field"><label>Notatka</label><textarea id="rfNotes"></textarea></div></div><div class="actions"><button class="btn" data-close>Anuluj</button><button class="btn primary" data-save>Zapisz</button></div></div></div>`;const host=$('modalHost');host.querySelector('[data-close]').onclick=()=>host.innerHTML='';host.querySelector('[data-save]').onclick=async()=>{const title=$('rfTitle').value.trim(),date=$('rfDate').value,time=$('rfTime').value||'09:00';if(!title||!date){toast('Podaj tytuł i datę.');return}const due=new Date(`${date}T${time}:00`);try{await CFCalendarEngine.saveReminder({title,notes:$('rfNotes').value.trim()||null,priority:$('rfPriority').value,company_id:$('rfCompany').value||null,vehicle_plate:$('rfPlate').value.trim()||null,remind_at:due.toISOString(),due_at:due.toISOString(),reminder_mode:'at_time',status:'active',recurrence:'none',is_payment:false});host.innerHTML='';toast('Przypomnienie dodane.');await load(false)}catch(e){console.error(e);toast('Nie udało się dodać przypomnienia.')}}}
async function load(initial=true){if(initial){$('loading').classList.remove('hidden');$('content').classList.add('hidden')}try{data=await CFCalendarEngine.loadAll();const current=$('companyFilter').value;$('companyFilter').innerHTML='<option value="">Wszystkie firmy</option>'+data.companies.map(c=>`<option value="${esc(c.id)}">${esc(c.short_name||c.name||'Firma')}</option>`).join('');$('companyFilter').value=current&&data.companies.some(c=>String(c.id)===current)?current:'';render();$('content').classList.remove('hidden');if(initial){CFWeatherEngine.load({days:14}).then(x=>{weather=x;render()}).catch(()=>{})}}catch(e){console.error(e);$('loading').textContent=e?.message||'Nie udało się załadować kalendarza.';return}finally{if(initial)$('loading').classList.add('hidden')}}
$('backBtn').onclick=()=>history.back();$('addReminder').onclick=reminderForm;$('refresh').onclick=()=>load(false);$('today').onclick=()=>{cursor=new Date();render()};$('prev').onclick=()=>{cursor=view==='month'?new Date(cursor.getFullYear(),cursor.getMonth()-1,1,12):add(cursor,view==='week'?-7:-1);render()};$('next').onclick=()=>{cursor=view==='month'?new Date(cursor.getFullYear(),cursor.getMonth()+1,1,12):add(cursor,view==='week'?7:1);render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;syncViewButtons();render()});['companyFilter','eventFilter'].forEach(id=>$(id).onchange=render);$('search').oninput=render;load(true);
})();
</script>
</body>
</html>
