<title>Pranie Floty ‚Äî ewidencja</title>
<style>
.record-old-days.overdue{background:#c94b3f;color:#fff;}
.record-old-days.recent{background:#4a4a4a;color:#fff;}

  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    color-scheme: light;
    --paper:#F7F6F1;
    --paper-alt:#ECEAE1;
    --panel:#16150F;
    --on-panel:#F5F4EE;
    --green:#ABC02A;
    --green-ink:#6E7A17;
    --ink:#16150F;
    --ink-soft:#5B584B;
    --line:rgba(22,21,15,0.14);
    --line-strong:rgba(22,21,15,0.28);
    --red:#C24B3F;
    --red-bg:#F7E7E4;
    --green-bg:#EAF2D4;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{background:var(--paper);}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  @media (prefers-color-scheme: dark){
    html, body{background:#F7F6F1 !important; color:#16150F !important;}
  }

  h1,h2,h3{
    font-family:'Big Shoulders Display',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.01em;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:20;
  }
  header h1{font-size:22px;font-weight:800;}

  .header-top{display:flex;align-items:center;justify-content:space-between;}
  .app-logo{height:54px;width:auto;display:block;}
  .hamburger{
    background:none;border:none;cursor:pointer;
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    border-radius:8px;
  }
  .hamburger:active{background:var(--paper-alt);}
  .hamburger svg{width:22px;height:22px;}

  .menu-overlay{
    position:fixed;inset:0;
    background:rgba(22,21,15,0.5);
    z-index:60;
    display:none;
  }
  .menu-overlay.open{display:block;}
  .menu-drawer{
    position:absolute;
    top:0;right:0;bottom:0;
    width:82%;
    max-width:340px;
    background:var(--paper);
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow:-8px 0 24px rgba(22,21,15,0.15);
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.16,1,.3,1);
    display:flex;
    flex-direction:column;
  }
  .menu-overlay.open .menu-drawer{transform:translateX(0);}
  .menu-drawer-head{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px;
  }
  .menu-list{display:flex;flex-direction:column;gap:8px;flex:1;}
  .menu-item{
    text-align:left;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 14px;
    cursor:pointer;
    display:flex;flex-direction:column;gap:3px;
  }
  .menu-item:disabled{opacity:.72;cursor:default;}
  .menu-item:active{background:var(--paper-alt);}
  .menu-logout{margin-top:auto;border-color:rgba(194,75,63,0.35);}
  .menu-logout .menu-item-title{color:var(--red);}
  .menu-item-title{font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;}
  .cf-bell-icon{font-size:17px;line-height:1;display:inline-flex;align-items:center;justify-content:center;}
  .menu-item-sub{font-size:12px;color:var(--ink-soft);}
  header .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .wrap{max-width:720px;margin:0 auto;padding:0 16px;}

  .search-box{
    display:flex;
    gap:8px;
    margin-top:22px;
  }
  .search-box input{
    flex:1;
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:14px 16px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
  }
  .search-box input:focus{outline:2px solid var(--green-ink);outline-offset:1px;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:500;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:12px 18px;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .btn-solid{background:var(--green);color:var(--ink);}
  .btn-solid:hover{background:var(--ink);color:var(--paper);}
  .btn-outline{border:1px solid var(--line-strong);color:var(--ink);background:#fff;}
  .btn-outline:hover{border-color:var(--ink);}
  .btn-danger{background:var(--red);color:#fff;}
  .btn:active{transform:scale(0.97);}

  .section-title{
    font-size:13px;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:28px 0 12px;
  }

  .records{display:flex;flex-direction:column;gap:10px;}
  .empty-state{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    border:1px dashed var(--line-strong);
    border-radius:10px;
  }

  .record-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }
  .record-card.status-approved{
  border-color:#d5d5cf;
  background:#f3f3f0;
  box-shadow:none;
  opacity:.84;
}
.record-card.status-approved:hover{opacity:.94;}
.record-card.status-approved .record-meta,
.record-card.status-approved .record-description{color:#777771;}
.cf-wash-duration-line{margin-top:3px;}
.cf-wash-time-editor{
  display:flex;align-items:end;gap:10px;padding:10px 12px 12px;
  border-top:1px solid rgba(0,0,0,.07);background:rgba(0,0,0,.018);
}
.cf-wash-time-editor label{display:flex;flex-direction:column;gap:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
.cf-wash-time-editor input[type=time]{min-height:38px;width:112px;box-sizing:border-box;border:1px solid var(--line-strong,#d9d6c9);border-radius:8px;background:#fff;padding:6px 8px;font:inherit;color:var(--ink);}
.cf-wash-time-summary{min-height:38px;display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12px;}
.cf-wash-time-summary span{color:var(--ink-soft);}
.cf-wash-time-summary strong{font-size:13px;}
.cf-wash-duration-inline{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:6px;
  padding-left:12px;
  font-size:12px;
  white-space:nowrap;
}
.cf-wash-duration-inline span{color:var(--ink-soft);}
.cf-wash-duration-inline strong{font-size:13px;color:var(--ink);}
.cf-wash-time-ok{
  min-height:38px;
  padding:0 18px;
  align-self:end;
}
@media(max-width:620px){
  .record-toggles{
    display:flex;
    flex-wrap:wrap;
    column-gap:12px;
    row-gap:8px;
  }
  .record-toggles .cf-record-chat-btn{
    margin-left:auto;
  }
  .cf-wash-duration-inline{
    flex:0 0 100%;
    width:100%;
    margin-left:0;
    padding:8px 0 0;
    border-top:1px solid rgba(0,0,0,.06);
    justify-content:flex-end;
  }
  .cf-wash-time-editor{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:9px;
  }
  .cf-wash-time-editor label{
    width:100%;
  }
  .cf-wash-time-editor input[type=time]{
    width:100%;
    min-height:44px;
  }
  .cf-wash-time-summary{
    width:100%;
    margin-left:0;
    justify-content:space-between;
  }
  .cf-wash-time-ok{
    width:100%;
    align-self:stretch;
  }
  .cf-main-search-box{
    overflow:visible;
  }
  .cf-search-input-wrap{
    width:100%;
  }
}
  .record-card.status-pending{border-color:rgba(224,139,35,.65);}
  .record-card.status-other{border-color:var(--line);}

  .record-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    cursor:pointer;
  }
  .record-plate{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.03em;
  }
  .record-meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .record-description{margin-top:4px;line-height:1.35;}
  .record-badge{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:4px;
    background:var(--paper-alt);
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .record-cost{font-size:13px;font-weight:600;white-space:nowrap;}

  .record-toggles{
    display:flex;
    gap:18px;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .toggle{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12.5px;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .toggle input{width:17px;height:17px;accent-color:var(--green-ink);cursor:pointer;}
  .toggle.on{color:var(--ink);font-weight:600;}

  .bottom-bar{
    position:fixed !important;
    left:0;right:0;bottom:0 !important;top:auto !important;
    width:100%;
    background:var(--panel);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    z-index:1000;

.cf-vehicle-profile{color:var(--text,#20251e)}.cf-vehicle-heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.cf-vehicle-heading .record-plate{font-size:26px}.cf-vehicle-data{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}.cf-vehicle-data dt,.cf-vehicle-summary span,.cf-vehicle-current>span{font-size:11px;color:#687063}.cf-vehicle-data dd{margin:4px 0 0;font-size:15px;font-weight:700;overflow-wrap:anywhere;white-space:pre-wrap}.cf-vehicle-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.cf-vehicle-summary>div{background:#f3f6e9;border:1px solid #dce5c4;border-radius:14px;padding:14px}.cf-vehicle-summary strong,.cf-vehicle-summary small{display:block;margin-top:5px}.cf-vehicle-current{margin-top:14px;border:1px solid #dce5c4;padding:14px;border-radius:14px}.cf-vehicle-current>strong{display:block;font-size:12px;margin:6px 0 12px}.cf-vehicle-history-title{font-size:16px;margin:24px 0 10px}.cf-vehicle-history-title span{color:#687063;font-weight:500}.cf-vehicle-history,.cf-vehicle-results{display:grid;gap:9px}.cf-vehicle-wash,.cf-vehicle-result{width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid #dfe4d7;border-radius:12px;padding:13px;cursor:pointer}.cf-vehicle-wash{border-left:4px solid #9fbd17}.cf-vehicle-wash span,.cf-vehicle-wash small,.cf-vehicle-result>span{display:block;margin-top:6px;overflow-wrap:anywhere}.cf-vehicle-wash small{color:#626a5c}.cf-vehicle-result .cf-vehicle-heading{display:flex}.cf-vehicle-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid #e3e7dc}.cf-vehicle-actions .btn{flex:1;min-width:140px}.cf-vehicle-result:focus-visible,.cf-vehicle-wash:focus-visible{outline:3px solid #9fbd17;outline-offset:2px}
</style>

<style id="cfVehicleResponsiveFix">
.cf-record-plate-link{appearance:none;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer;padding:0}.cf-record-plate-link:focus-visible{outline:2px solid #9fbd17;outline-offset:3px;border-radius:3px}

/* Scope overflow fixes to the vehicle profile, preserving other sheets. */
#reportOverlay .sheet.cf-profile-sheet{box-sizing:border-box;width:100%;max-width:680px;min-width:0}
.cf-profile-sheet #reportBody,.cf-profile-sheet .cf-vehicle-profile{min-width:0;max-width:100%;clear:both}
.cf-profile-sheet .cf-vehicle-profile *{box-sizing:border-box}
.cf-profile-sheet .cf-profile-identity{min-width:0;max-width:100%}
.cf-profile-sheet .cf-profile-specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:100%}
.cf-profile-sheet .cf-profile-specs>div{min-width:0;max-width:100%;padding-right:10px}
.cf-profile-sheet .cf-profile-specs dd{overflow-wrap:anywhere;white-space:normal}
.cf-profile-sheet .cf-vehicle-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
.cf-profile-sheet .cf-vehicle-summary>div,.cf-profile-sheet .cf-vehicle-current,.cf-profile-sheet .cf-vehicle-history,.cf-profile-sheet .cf-vehicle-wash{min-width:0;max-width:100%;overflow-wrap:anywhere}
.cf-profile-sheet .cf-vehicle-current .btn,.cf-profile-sheet .history-button{max-width:100%;min-width:0;white-space:normal;overflow-wrap:anywhere}
.cf-main-search-box{min-width:0;max-width:100%}
.cf-main-search-box .cf-search-input-wrap{min-width:0;max-width:100%}
#searchInput{font-size:16px!important;min-width:0;max-width:100%;box-sizing:border-box}
#cfSearchSuggestions{box-sizing:border-box;max-width:calc(100vw - 16px)}
@media(max-width:639px){
 #reportOverlay .sheet.cf-profile-sheet{width:100%;max-width:100%!important;padding-left:14px;padding-right:14px}
 .cf-profile-sheet .cf-profile-specs{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:12px 0}
 .cf-profile-sheet .cf-profile-specs>div{flex:0 1 auto;width:max-content;max-width:100%;padding-right:10px}
 .cf-profile-sheet .cf-profile-identity{gap:6px}
 .cf-profile-sheet .cf-profile-plate{flex:0 1 auto;max-width:65%;min-width:0}
 .cf-profile-sheet .cf-profile-plate>strong{font-size:clamp(16px,4.5vw,22px);padding:6px;min-width:0;white-space:normal;overflow-wrap:anywhere}
 .cf-profile-sheet .cf-profile-eu{flex-basis:20px}
 .cf-profile-sheet .cf-profile-company{font-size:11px;flex:1 1 48px;min-width:0}
 .cf-profile-sheet .record-fleet-badge{width:36px;height:36px;font-size:10px;white-space:normal;overflow-wrap:anywhere;padding:2px}
 .cf-profile-sheet .cf-vehicle-actions{flex-direction:column;gap:8px}
 .cf-profile-sheet .cf-vehicle-actions .btn{flex:none;width:100%;min-width:0;max-width:100%;min-height:44px;padding:10px 12px;font-size:13px;white-space:normal}
 .cf-profile-sheet .cf-vehicle-current .btn,.cf-profile-sheet .history-button{font-size:12px;padding:9px 10px}
 .cf-main-search-box{gap:6px}
 .cf-main-search-box #searchBtn{min-width:0;padding:10px;font-size:13px}
 .cf-main-search-box #plateCameraBtn{min-width:42px;padding:8px;font-size:18px}
}
@media(max-width:359px){
 .cf-profile-sheet .cf-vehicle-summary{grid-template-columns:minmax(0,1fr)}
}
</style>
