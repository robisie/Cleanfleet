<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Moje płatności</title>
<style>
:root{--ink:#183129;--green:#275c48;--muted:#64766d;--border:#dae4de;--bg:#f4f7f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button,.link{border:1px solid var(--border);background:white;border-radius:12px;padding:10px 15px;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.5;cursor:wait}button.danger{color:#a52e32}input,select{width:100%;border:1px solid #bbcfc2;border-radius:9px;background:#fff;color:var(--ink);padding:9px;min-width:0}input[type=checkbox]{width:21px;height:21px;accent-color:var(--green)}label{display:grid;gap:5px;font-size:13px;color:var(--muted)}h1,h2,h3,p{margin:0 0 12px}h1{font-size:30px;letter-spacing:-1px}h2{font-size:22px}h3{font-size:17px}small,.muted{color:var(--muted)}[hidden]{display:none!important}.wrap{max-width:1200px;margin:auto;padding:32px 22px 60px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:24px}.card{background:white;border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 5px 20px #244d3710}.gate{max-width:460px;margin:10vh auto;padding:28px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:var(--green);margin-bottom:10px}.error{color:#a52e32}.notice{padding:12px 16px;border-radius:12px;background:#e8f1eb;margin:15px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stats strong{display:block;font-size:25px}.payments{display:grid;gap:16px}.payment-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:16px}.month{padding:11px 7px;text-align:left;border-radius:11px;font-size:12px;min-height:86px}.month b,.month span{display:block}.month strong{display:block;margin-top:4px}.paid{background:#edf6ef;border-color:#bdd8c3}.difference{background:#fff5e0;border-color:#e5cf9a}.missing{background:#fdeeee;border-color:#e5b6b8}.unknown{background:#f1f3f6;border-color:#d7dce4}.inactive{opacity:.5}.pending{background:#f5f8fa}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border);vertical-align:top}td input,td select{min-width:100px}th{color:var(--muted)}dialog{border:0;border-radius:22px;max-width:min(1120px,calc(100vw - 24px));width:100%;padding:0;max-height:calc(100dvh - 36px);color:var(--ink);box-shadow:0 20px 80px #0003}dialog::backdrop{background:#10251aa0}.dialog-head{position:sticky;top:0;z-index:2;background:white;padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}.dialog-head h2{margin:0}.dialog-body{padding:22px}.dialog-foot{position:sticky;bottom:0;background:white;padding:16px 22px;border-top:1px solid var(--border)}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rule{border:1px solid var(--border);border-radius:15px;padding:16px;margin:16px 0}.checkline{display:flex;align-items:center;gap:10px}.checkline input{flex:0 0 21px}.inline{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.empty{text-align:center;padding:40px 20px}#message{position:sticky;top:8px;z-index:10}#year{width:115px}.history-row{display:grid;grid-template-columns:1fr 1.3fr 150px;gap:14px;padding:16px 0;border-bottom:1px solid var(--border)}.history-row p{margin-bottom:4px;overflow-wrap:anywhere}.history-row label{margin-top:6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}#gate input{margin-bottom:14px}.tag{font-size:11px;letter-spacing:.6px;border-radius:20px;padding:4px 10px;background:#edf3ef}.source{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:100px;overflow:auto}
@media(max-width:700px){.wrap{padding:20px 12px 45px}h1{font-size:26px}.stats{gap:7px}.stats .card{padding:12px}.stats strong{font-size:20px}.months{grid-template-columns:repeat(3,minmax(0,1fr))}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:16px}.dialog-body{padding:14px}.history-row{grid-template-columns:1fr}.gate{margin:6vh 12px}.toolbar button{padding:9px 12px}}@media(max-width:400px){.form-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.stats .card{display:flex;gap:12px;align-items:center}}
/* Date fields keep the established 32px inset, including iPad native controls. */
input[type="date"],input[type="month"]{width:calc(100% - 32px)!important;min-width:0!important;max-width:calc(100% - 32px)!important;box-sizing:border-box}
.import-source{padding:14px 16px;border:1px solid var(--border);border-radius:14px;margin:12px 0}.import-source p{margin:6px 0}.import-list{margin-top:14px}.import-row{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(130px,180px);gap:16px;padding:18px 4px;border-bottom:1px solid var(--border);align-items:start}.import-row>input{margin:3px 0}.import-description{min-width:0}.import-description>strong{font-size:17px;display:block;overflow-wrap:anywhere}.import-description p{margin:6px 0;overflow-wrap:anywhere}.import-description>small{display:block;overflow-wrap:anywhere}.import-description details{margin-top:7px;color:var(--muted);font-size:12px}.import-amount{text-align:right}.import-amount strong{font-size:18px;display:block}.import-amount small{display:block;margin-top:4px}.import-unread{background:#fff7eb;border-radius:12px;padding:18px 10px}.import-unread .import-amount strong{font-size:14px;color:#915d12}.import-search{flex:1;max-width:460px}
@media(max-width:600px){.import-row{grid-template-columns:22px minmax(0,1fr);gap:10px}.import-amount{grid-column:2;text-align:left}.import-description>strong{font-size:16px}.import-amount strong{font-size:17px}}
.contractor-row{display:flex;align-items:center;gap:16px;padding:18px 12px;border-bottom:1px solid var(--line);cursor:pointer}.contractor-row input{flex:0 0 24px;width:24px;height:24px}.contractor-row strong{overflow-wrap:anywhere}.contractor-row[hidden]{display:none}</style></head><body>
<section id="gate" class="card gate"><div class="eyebrow">Prywatne narzędzie</div><h1>Moje płatności</h1><p id="gateInfo">Sprawdzam dostęp administratora…</p><form id="unlockForm" hidden><label>PIN lub hasło<input id="pin" type="password" autocomplete="current-password" minlength="6" required placeholder="Minimum 6 znaków"></label><label id="repeatLabel" hidden>Powtórz PIN lub hasło<input id="repeatPin" type="password" autocomplete="new-password"></label><button class="primary" id="unlock">Odblokuj</button></form><p id="gateError" class="error" role="alert"></p><a class="link" href="/app/">Wróć do panelu</a></section>
<main id="main" class="wrap" hidden><header class="toolbar top"><div><div class="eyebrow">Twoja lista · twoje rozliczenia</div><h1>Moje płatności</h1><span class="tag">Osobne narzędzie · v1.0.5</span></div><div class="toolbar"><a class="link" href="/app/">Panel administratora</a><button id="lock">Zablokuj</button></div></header><div id="message" role="status" hidden></div>
<div class="toolbar"><button class="primary" id="editList">Edytuj listę</button><button id="import">Zaczytaj z wyciągu</button><button id="history">Historia przelewów</button><button id="settings">Ustawienia</button><label>Rok<select id="year"></select></label></div>
<div id="stats" class="stats"></div><p class="muted" id="coverage"></p><div class="payments" id="payments"></div></main>
<dialog id="modal"><div class="dialog-head"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="Zamknij">Zamknij</button></div><div id="modalBody" class="dialog-body"></div><div id="modalFoot" class="dialog-foot"></div></dialog>
<input type="file" id="pdfFile" accept="application/pdf,.pdf" multiple hidden><input type="file" id="backupFile" accept="application/json,.json" hidden>
<script src="/app/priv/engine.js?v=105"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script><script type="module" src="/app/priv/ui.js?v=105"></script>
</body></html>
