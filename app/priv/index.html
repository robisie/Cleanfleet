<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Moje finanse</title>
<style>

input[type="date"],input[type="month"]{width:calc(100% - 32px)!important;min-width:0!important;max-width:calc(100% - 32px)!important;box-sizing:border-box}
.import-source{padding:14px 16px;border:1px solid var(--border);border-radius:14px;margin:12px 0}.import-source p{margin:6px 0}.import-list{margin-top:14px}.import-row{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(130px,180px);gap:16px;padding:18px 4px;border-bottom:1px solid var(--border);align-items:start}.import-row>input{margin:3px 0}.import-description{min-width:0}.import-description>strong{font-size:17px;display:block;overflow-wrap:anywhere}.import-description p{margin:6px 0;overflow-wrap:anywhere}.import-description>small{display:block;overflow-wrap:anywhere}.import-description details{margin-top:7px;color:var(--muted);font-size:12px}.import-amount{text-align:right}.import-amount strong{font-size:18px;display:block}.import-amount small{display:block;margin-top:4px}.import-unread{background:#fff7eb;border-radius:12px;padding:18px 10px}.import-unread .import-amount strong{font-size:14px;color:#915d12}.import-search{flex:1;max-width:460px}

.contractor-row{display:flex;align-items:center;gap:16px;padding:18px 12px;border-bottom:1px solid var(--line);cursor:pointer}.contractor-row input{flex:0 0 24px;width:24px;height:24px}.contractor-row strong{overflow-wrap:anywhere}.contractor-row[hidden]{display:none}.payment-totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin:18px 0 6px}.payment-totals>div{background:#edf3ef;border-radius:12px;padding:12px 14px;min-width:0}.payment-totals strong{display:block;font-size:22px;margin-top:3px;overflow-wrap:anywhere}.monthly-due{margin-bottom:16px}.due-items{display:flex;flex-wrap:wrap;gap:10px}.due-item{flex:1 1 180px;min-width:0;padding:10px 12px;background:#edf3ef;border:1px solid var(--border);border-radius:10px}.due-item strong{display:block;font-size:14px;overflow-wrap:anywhere}.due-item span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.due-item{text-align:left;cursor:pointer}.due-item:hover{background:#e0ece4}.due-item:focus-visible{outline:2px solid var(--green);outline-offset:2px}.payment-card{scroll-margin-top:calc(96px + env(safe-area-inset-top))}.payment-card:focus{outline:2px solid var(--green);outline-offset:3px}/* Mobile safe areas and readable form controls prevent iOS focus zoom. */

@media(max-width:700px){.wrap{padding-top:calc(20px + env(safe-area-inset-top));padding-right:calc(12px + env(safe-area-inset-right));padding-bottom:calc(45px + env(safe-area-inset-bottom));padding-left:calc(12px + env(safe-area-inset-left))}.gate{margin-top:calc(24px + env(safe-area-inset-top));margin-right:max(12px,env(safe-area-inset-right));margin-left:max(12px,env(safe-area-inset-left))}.toolbar button,.toolbar .link{font-size:14px}.top{gap:14px;margin-bottom:18px}h1{font-size:24px}}
@media(max-width:400px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stats .card{display:block;padding:10px;min-width:0}.stats .card small{font-size:11px;overflow-wrap:anywhere}.stats strong{font-size:20px;margin-top:4px}}
/* Only the cash list scrolls; entry fields and balance remain visible. */
dialog.cash-dialog[open]{display:flex;flex-direction:column;height:min(760px,calc(100dvh - 36px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));overflow:hidden}.cash-dialog .dialog-head{position:static;flex:none}.cash-dialog .dialog-body{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}.cash-dialog .dialog-foot{display:none}.cash-form{display:grid;grid-template-columns:140px minmax(0,1fr) 140px auto;gap:10px;align-items:end;flex:none}.cash-form label{min-width:0}.cash-form input,.cash-form select{height:44px}.cash-error{margin:8px 0 0;flex:none}.cash-error:empty{display:none}.cash-total{background:#edf3ef;border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin:16px 0;font-size:20px;flex:none;overflow-wrap:anywhere}.cash-list{overflow-y:auto;min-height:0;flex:1;overscroll-behavior:contain}.cash-list ul{list-style:none;padding:0;margin:0}.cash-row{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}.cash-row strong,.cash-row small{display:block;overflow-wrap:anywhere}.cash-value{white-space:nowrap}.cash-income{color:#275c48}.cash-expense{color:#a52e32}.cash-row button{padding:8px;font-size:22px;line-height:1;min-height:44px}.cash-empty{padding:12px 0}

<section id="gate" class="card gate"><div class="eyebrow">Prywatne narzędzie</div><h1>Moje finanse</h1><p id="gateInfo">Sprawdzam dostęp administratora…</p><form id="unlockForm" hidden><label>PIN lub hasło<input id="pin" type="password" autocomplete="current-password" minlength="6" required placeholder="Minimum 6 znaków"></label><label id="repeatLabel" hidden>Powtórz PIN lub hasło<input id="repeatPin" type="password" autocomplete="new-password"></label><button class="primary" id="unlock">Odblokuj</button></form><p id="gateError" class="error" role="alert"></p><a class="link" href="/app/">Wróć do panelu</a></section>
<main id="main" class="wrap" hidden><header class="toolbar top"><div><div class="eyebrow">Twoja lista · twoje rozliczenia</div><h1>Moje finanse</h1><span class="tag">Osobne narzędzie · v1.1.0</span></div><div class="toolbar"><a class="link" href="/app/">Panel administratora</a><button id="lock">Zablokuj</button></div></header><div id="message" role="status" hidden></div>
<section id="financePaymentsPane"><div class="toolbar"><button class="primary" id="editList">Edytuj listę</button><button id="mergeList">Scal pozycje</button><button id="import">Zaczytaj z wyciągu</button><button id="history">Historia przelewów</button><button id="settings">Ustawienia</button><label>Rok<select id="year"></select></label></div>
<div id="stats" class="stats"></div><p class="muted" id="coverage"></p><section id="monthlyDue" class="card monthly-due" hidden></section><div class="payments" id="payments"></div></section><section id="financeCashPane" class="finance-cash-pane" hidden></section></main>
