<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101412">
<title>CleanFleet Weather</title>
<style>
  :root{--bg:#0f1311;--panel:#171d19;--panel2:#1d2520;--line:#2a342e;--text:#f3f7f4;--muted:#96a39b;--green:#48a868;--blue:#4aa3df;--warn:#e9a94b;--red:#db6464}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#0d110f,#151a17 42%,#0f1311);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  button{font:inherit}
  .app{min-height:100vh;max-width:1500px;margin:0 auto;padding:18px 18px 40px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .back,.refresh{border:1px solid var(--line);background:#151a17;color:var(--text);border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}
  .brand{text-align:center;flex:1}.brand strong{display:block;font-size:18px;letter-spacing:.2px}.brand span{font-size:11px;color:var(--muted)}
  .hero{background:radial-gradient(circle at 80% 10%,rgba(72,168,104,.18),transparent 35%),linear-gradient(135deg,#1b241f,#111613);border:1px solid var(--line);border-radius:24px;padding:22px;display:grid;grid-template-columns:1.3fr .7fr;gap:20px;box-shadow:0 18px 45px rgba(0,0,0,.22)}
  .hero-main{display:flex;gap:18px;align-items:center}.hero-icon{font-size:74px;line-height:1}.hero-temp{font-size:64px;line-height:.9;font-weight:900}.hero-desc{font-size:16px;font-weight:800;margin-top:8px}.hero-meta{color:var(--muted);font-size:12px;margin-top:8px}
  .hero-side{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:15px;padding:12px}.mini span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.mini strong{font-size:18px}
  .status{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0;color:var(--muted);font-size:12px}.status .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
  .days{display:grid;grid-template-columns:repeat(14,minmax(105px,1fr));gap:10px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:thin}
  .day{min-width:105px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:16px;padding:12px 10px;text-align:center;cursor:pointer;transition:.18s transform,.18s border-color,.18s background}.day:hover{transform:translateY(-2px)}.day.active{border-color:var(--green);background:#1a2820}.day .dow{font-size:11px;color:var(--muted);font-weight:800}.day .date{font-size:10px;color:#748178;margin-top:3px}.day .ico{font-size:28px;margin:8px 0}.day .temps{font-size:14px;font-weight:900}.day .temps span{color:var(--muted);font-weight:700}.day .rain{font-size:10px;color:var(--blue);margin-top:5px}.day .conf{margin-top:7px;font-size:9px;color:var(--muted)}
  .section{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.section h2{font-size:15px;margin:0 0 14px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section-head h2{margin:0}.work-pill{border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900;background:#213226;color:#9fe0b4;border:1px solid #31523c}
  .metrics{display:grid;grid-template-columns:repeat(8,minmax(110px,1fr));gap:10px}.metric{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px}.metric span{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.metric strong{font-size:17px}
  .hourly{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(88px,1fr);gap:8px;overflow-x:auto;padding-bottom:8px;cursor:grab;scrollbar-width:thin;overscroll-behavior-x:contain}.hourly.dragging{cursor:grabbing;user-select:none}.hour{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.hour.current{border-color:#72d393;background:#23382b;box-shadow:0 0 0 2px rgba(72,168,104,.34)}.hour.current .time{color:#b7f2c9}.hour .time{font-size:10px;color:var(--muted);font-weight:800}.hour .ico{font-size:23px;margin:5px 0}.hour .temp{font-size:14px;font-weight:900}.hour .small{font-size:9px;color:var(--muted);margin-top:4px}.hour .wet{color:var(--blue)}
  .models{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:10px}.model{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px}.model h3{font-size:12px;margin:0 0 8px}.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.model-grid div{font-size:10px;color:var(--muted)}.model-grid strong{display:block;color:var(--text);font-size:12px;margin-top:2px}
  .forecast-layout{min-width:0}
  .forecast-layout>*{min-width:0}
  .forecast-days-title{display:none}
  .details-column{min-width:0}
  .loading,.error{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-weight:700}.error{color:#ef9b9b}
  .hidden{display:none!important}
  @media(min-width:901px){
    .forecast-layout{display:grid;grid-template-columns:minmax(220px,.82fr) minmax(0,1.65fr) minmax(270px,1fr);gap:14px;align-items:start}
    .forecast-hourly{grid-column:2;grid-row:1;margin-top:0}
    .forecast-days{grid-column:1;grid-row:1;margin-top:0;padding:14px}
    .forecast-days-title{display:block;margin:0 0 12px;font-size:15px}
    .details-column{grid-column:3;grid-row:1;display:grid;gap:14px}
    .details-column .section{margin-top:0;padding:14px}
    .days{display:flex;flex-direction:column;gap:8px;overflow:visible;padding:0}
    .day{width:100%;min-width:0;display:grid;grid-template-columns:minmax(62px,1fr) 38px auto;grid-template-rows:auto auto;grid-template-areas:"dow ico temps" "date ico rain";align-items:center;column-gap:8px;padding:9px 10px;text-align:left;border-radius:13px}
    .day:hover{transform:translateX(2px)}
    .day .dow{grid-area:dow;font-size:11px;color:var(--text)}
    .day .date{grid-area:date;margin:2px 0 0;font-size:9px}
    .day .ico{grid-area:ico;margin:0;font-size:25px;text-align:center}
    .day .temps{grid-area:temps;text-align:right;font-size:13px;white-space:nowrap}
    .day .rain{grid-area:rain;text-align:right;margin:2px 0 0;font-size:9px;white-space:nowrap}
    .day .conf{display:none}
    .forecast-hourly .hourly{grid-auto-columns:minmax(94px,108px)}
    .details-column .metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .details-column .metric{padding:10px}
    .details-column .metric strong{font-size:14px}
    .details-column .models{grid-template-columns:1fr;gap:8px}
    .details-column .model{padding:10px}
    .details-column .section-head{align-items:flex-start;flex-direction:column}
    .details-column .work-pill{width:100%;line-height:1.35}
  }
  @media(min-width:1220px){
    .forecast-layout{grid-template-columns:minmax(240px,.78fr) minmax(0,1.7fr) minmax(310px,1fr);gap:16px}
    .details-column .models{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:900px){.hero{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(4,1fr)}.models{grid-template-columns:repeat(2,1fr)}.forecast-days{margin-top:0;background:transparent;border:0;padding:0}.forecast-layout{display:flex;flex-direction:column}.forecast-hourly{order:1}.forecast-days{order:2}.details-column{order:3}}
  @media(max-width:620px){.app{padding:12px 10px 28px}.brand strong{font-size:15px}.back,.refresh{padding:9px 11px;font-size:12px}.hero{padding:17px;border-radius:20px}.hero-main{gap:12px}.hero-icon{font-size:52px}.hero-temp{font-size:48px}.hero-side{grid-template-columns:repeat(4,1fr);gap:6px}.mini{padding:8px}.mini strong{font-size:13px}.metrics{grid-template-columns:repeat(2,1fr)}.models{grid-template-columns:1fr}.section{padding:14px;border-radius:17px}.days{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:100px}.status{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="back" id="backBtn">← CleanFleet</button>
    <div class="brand"><strong>CleanFleet Weather</strong><span>4 modele · prognoza 14 dni</span></div>
    <button class="refresh" id="refreshBtn">Odśwież</button>
  </div>

  <div id="loading" class="loading">Analizuję ECMWF, ICON, GFS i MET Norway…</div>
  <div id="error" class="error hidden"></div>

  <main id="content" class="hidden">
    <section class="hero">
      <div class="hero-main">
        <div class="hero-icon" id="heroIcon">🌤️</div>
        <div>
          <div class="hero-temp" id="heroTemp">--°</div>
          <div class="hero-desc" id="heroDesc">—</div>
          <div class="hero-meta" id="heroMeta">—</div>
        </div>
      </div>
      <div class="hero-side">
        <div class="mini"><span>Opady</span><strong id="heroRain">—</strong></div>
        <div class="mini"><span>Wiatr</span><strong id="heroWind">—</strong></div>
        <div class="mini"><span>Porywy</span><strong id="heroGust">—</strong></div>
        <div class="mini"><span>Pewność</span><strong id="heroConf">—</strong></div>
      </div>
    </section>

    <div class="status">
      <div id="modelStatus"><span class="dot"></span>Ładowanie modeli…</div>
      <div id="updatedAt">—</div>
    </div>

    <div class="forecast-layout">
      <section class="section forecast-hourly">
        <h2>Prognoza godzinowa</h2>
        <div class="hourly" id="hourly"></div>
      </section>

      <section class="section forecast-days">
        <h2 class="forecast-days-title">Prognoza na 14 dni</h2>
        <div class="days" id="days"></div>
      </section>

      <div class="details-column">
        <section class="section">
          <div class="section-head"><h2 id="detailTitle">Szczegóły dnia</h2><div class="work-pill" id="workPill">Warunki: —</div></div>
          <div class="metrics" id="metrics"></div>
        </section>

        <section class="section">
          <h2>Porównanie modeli</h2>
          <div class="models" id="models"></div>
        </section>
      </div>
    </div>
  </main>
</div>
<script src="/app/weather-engine.js?v=20260917-1"></script>
<script>
(()=>{
  'use strict';
  const REFRESH_MS=90*60*1000;
  let forecast=null,selectedDate=null,lastLoad=0,loading=false,timer=null;
  const $=id=>document.getElementById(id);
  const fmtDate=s=>new Date(s+'T12:00:00').toLocaleDateString('pl-PL',{weekday:'long',day:'2-digit',month:'long'});
  const shortDate=s=>new Date(s+'T12:00:00').toLocaleDateString('pl-PL',{weekday:'short',day:'2-digit',month:'2-digit'});
  const n=(v,s='')=>v==null?'—':`${v}${s}`;
  function warsawNow(){
    const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Warsaw',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
    return {date:`${parts.year}-${parts.month}-${parts.day}`,hour:Number(parts.hour)};
  }

  const hourly=$('hourly');
  let hourlyDrag=false,hourlyMoved=false,hourlyStartX=0,hourlyStartScroll=0;
  function alignCurrentHour(){
    const current=hourly.querySelector('[data-current-hour="1"]');
    hourly.style.paddingRight=current?`${Math.max(0,hourly.clientWidth-current.offsetWidth-8)}px`:'0px';
    hourly.scrollLeft=current?Math.max(0,current.offsetLeft-hourly.offsetLeft):0;
  }
  hourly.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse'||e.button!==0)return;
    hourlyDrag=true;hourlyMoved=false;hourlyStartX=e.clientX;hourlyStartScroll=hourly.scrollLeft;
    hourly.classList.add('dragging');hourly.setPointerCapture?.(e.pointerId);
  });
  hourly.addEventListener('pointermove',e=>{
    if(!hourlyDrag)return;
    const delta=e.clientX-hourlyStartX;
    if(Math.abs(delta)>3)hourlyMoved=true;
    if(hourlyMoved){e.preventDefault();hourly.scrollLeft=hourlyStartScroll-delta;}
  });
  const stopHourlyDrag=()=>{hourlyDrag=false;hourly.classList.remove('dragging');};
  hourly.addEventListener('pointerup',stopHourlyDrag);
  hourly.addEventListener('pointercancel',stopHourlyDrag);
  window.addEventListener('resize',()=>requestAnimationFrame(alignCurrentHour),{passive:true});

  function heroLabel(d){
    if((d.gust||0)>=55)return'Wietrznie / trudniejsze warunki';
    if((d.rain||0)>=4)return'Deszczowo';
    if((d.pop||0)>=60)return'Możliwe opady';
    if(d.code===0)return'Bezchmurnie';
    if([1,2].includes(d.code))return'Pogodnie';
    if(d.code===3)return'Pochmurno';
    return d.work?.label||'Prognoza dnia';
  }

  function renderDays(){
    $('days').innerHTML=forecast.daily.map(d=>`<button class="day ${d.date===selectedDate?'active':''}" data-date="${d.date}"><div class="dow">${shortDate(d.date).split(',')[0]}</div><div class="date">${shortDate(d.date).split(',')[1]||''}</div><div class="ico">${d.icon}</div><div class="temps">${Math.round(d.tmax??0)}° <span>${Math.round(d.tmin??0)}°</span></div><div class="rain">${d.rain??0} mm · ${d.pop??0}%</div><div class="conf">pewność ${d.confidence}%</div></button>`).join('');
    $('days').querySelectorAll('[data-date]').forEach(b=>b.addEventListener('click',()=>{selectedDate=b.dataset.date;render();}));
  }

  function render(){
    if(!forecast?.daily?.length)return;
    const d=forecast.daily.find(x=>x.date===selectedDate)||forecast.daily[0];
    selectedDate=d.date;
    $('heroIcon').textContent=d.icon;
    $('heroTemp').textContent=`${Math.round(d.tmax??0)}°`;
    $('heroDesc').textContent=heroLabel(d);
    $('heroMeta').textContent=`${fmtDate(d.date)} · odczuwalna ${n(d.feelsMax,'°')} / ${n(d.feelsMin,'°')}`;
    $('heroRain').textContent=`${d.rain??0} mm`;
    $('heroWind').textContent=`${d.wind??0} km/h`;
    $('heroGust').textContent=`${d.gust??0} km/h`;
    $('heroConf').textContent=`${d.confidence}%`;
    $('detailTitle').textContent=fmtDate(d.date);
    $('workPill').textContent=`Warunki do pracy: ${d.work.label} · ${d.work.score}/100`;
    $('metrics').innerHTML=[
      ['Temp. max',n(d.tmax,'°C')],['Temp. min',n(d.tmin,'°C')],['Odczuwalna max',n(d.feelsMax,'°C')],['Odczuwalna min',n(d.feelsMin,'°C')],
      ['Opady',n(d.rain,' mm')],['Ryzyko opadów',n(d.pop,'%')],['Wiatr',n(d.wind,' km/h')],['Porywy',n(d.gust,' km/h')]
    ].map(([a,b])=>`<div class="metric"><span>${a}</span><strong>${b}</strong></div>`).join('');

    const hours=forecast.hourly(d.date),now=warsawNow(),isToday=d.date===now.date;
    hourly.innerHTML=hours.map(h=>{const current=isToday&&Number.parseInt(h.hour,10)===now.hour;return`<div class="hour${current?' current':''}"${current?' data-current-hour="1" aria-current="time"':''}><div class="time">${h.hour}</div><div class="ico">${h.icon}</div><div class="temp">${n(h.temp,'°')}</div><div class="small wet">${n(h.pop,'%')} · ${n(h.rain,' mm')}</div><div class="small">💨 ${n(h.wind,' km/h')}</div><div class="small">💧 ${n(h.humidity,'%')}</div></div>`;}).join('')||'<div class="hour">Brak danych godzinowych</div>';
    requestAnimationFrame(alignCurrentHour);

    $('models').innerHTML=d.models.map(m=>`<div class="model"><h3>${m.model.label}</h3><div class="model-grid"><div>Max<strong>${n(m.tmax,'°C')}</strong></div><div>Min<strong>${n(m.tmin,'°C')}</strong></div><div>Opady<strong>${n(m.rain,' mm')}</strong></div><div>Ryzyko<strong>${n(m.pop,'%')}</strong></div><div>Wiatr<strong>${n(m.wind,' km/h')}</strong></div><div>Porywy<strong>${n(m.gust,' km/h')}</strong></div></div></div>`).join('');

    renderDays();
  }

  async function load(force=false){
    if(loading)return;
    if(!force&&forecast&&Date.now()-lastLoad<REFRESH_MS)return;
    loading=true;
    $('loading').classList.remove('hidden');$('content').classList.add('hidden');$('error').classList.add('hidden');
    try{
      forecast=await window.CFWeatherEngine.load({days:14});
      lastLoad=Date.now();
      if(!selectedDate)selectedDate=forecast.daily[0]?.date||null;
      $('modelStatus').innerHTML=`<span class="dot"></span>Analiza ${forecast.models.length}/${forecast.totalModels}: ${forecast.models.join(' · ')}${forecast.missing.length?` · brak: ${forecast.missing.join(', ')}`:''}`;
      $('updatedAt').textContent=`Aktualizacja: ${new Date(forecast.generatedAt).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}`;
      render();
      $('content').classList.remove('hidden');
    }catch(err){$('error').textContent=err?.message||'Nie udało się pobrać prognozy.';$('error').classList.remove('hidden');}
    finally{$('loading').classList.add('hidden');loading=false;}
  }

  $('backBtn').addEventListener('click',()=>{history.back();});
  $('refreshBtn').addEventListener('click',()=>load(true));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastLoad>=REFRESH_MS)load(true);});
  timer=setInterval(()=>load(true),REFRESH_MS);
  load(true);
})();
</script>
</body>
</html>
