<title>Pranie Floty — ewidencja</title>
<style>
.record-old-days.overdue{background:#c94b3f;color:#fff;}
.record-old-days.recent{background:#4a4a4a;color:#fff;}

  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    color-scheme: light;
    --paper:#F7F6F1;
    --paper-alt:#ECEAE1;
    --panel:#16150F;
    --on-panel:#F5F4EE;
    --green:#ABC02A;
    --green-ink:#6E7A17;
    --ink:#16150F;
    --ink-soft:#5B584B;
    --line:rgba(22,21,15,0.14);
    --line-strong:rgba(22,21,15,0.28);
    --red:#C24B3F;
    --red-bg:#F7E7E4;
    --green-bg:#EAF2D4;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{background:var(--paper);}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  @media (prefers-color-scheme: dark){
    html, body{background:#F7F6F1 !important; color:#16150F !important;}
  }

  h1,h2,h3{
    font-family:'Big Shoulders Display',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.01em;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:20;
  }
  header h1{font-size:22px;font-weight:800;}

  .header-top{display:flex;align-items:center;justify-content:space-between;}
  .app-logo{height:54px;width:auto;display:block;}
  .hamburger{
    background:none;border:none;cursor:pointer;
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    border-radius:8px;
  }
  .hamburger:active{background:var(--paper-alt);}
  .hamburger svg{width:22px;height:22px;}

  .menu-overlay{
    position:fixed;inset:0;
    background:rgba(22,21,15,0.5);
    z-index:60;
    display:none;
  }
  .menu-overlay.open{display:block;}
  .menu-drawer{
    position:absolute;
    top:0;right:0;bottom:0;
    width:82%;
    max-width:340px;
    background:var(--paper);
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow:-8px 0 24px rgba(22,21,15,0.15);
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.16,1,.3,1);
    display:flex;
    flex-direction:column;
  }
  .menu-overlay.open .menu-drawer{transform:translateX(0);}
  .menu-drawer-head{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px;
  }
  .menu-list{display:flex;flex-direction:column;gap:8px;flex:1;}
  .menu-item{
    text-align:left;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 14px;
    cursor:pointer;
    display:flex;flex-direction:column;gap:3px;
  }
  .menu-item:disabled{opacity:.72;cursor:default;}
  .menu-item:active{background:var(--paper-alt);}
  .menu-logout{margin-top:auto;border-color:rgba(194,75,63,0.35);}
  .menu-logout .menu-item-title{color:var(--red);}
  .menu-item-title{font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;}
  .cf-bell-icon{font-size:17px;line-height:1;display:inline-flex;align-items:center;justify-content:center;}
  .menu-item-sub{font-size:12px;color:var(--ink-soft);}
  header .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .wrap{max-width:720px;margin:0 auto;padding:0 16px;}

  .search-box{
    display:flex;
    gap:8px;
    margin-top:22px;
  }
  .search-box input{
    flex:1;
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:14px 16px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
  }
  .search-box input:focus{outline:2px solid var(--green-ink);outline-offset:1px;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:500;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:12px 18px;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .btn-solid{background:var(--green);color:var(--ink);}
  .btn-solid:hover{background:var(--ink);color:var(--paper);}
  .btn-outline{border:1px solid var(--line-strong);color:var(--ink);background:#fff;}
  .btn-outline:hover{border-color:var(--ink);}
  .btn-danger{background:var(--red);color:#fff;}
  .btn:active{transform:scale(0.97);}

  .section-title{
    font-size:13px;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:28px 0 12px;
  }

  .records{display:flex;flex-direction:column;gap:10px;}
  .empty-state{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    border:1px dashed var(--line-strong);
    border-radius:10px;
  }

  .record-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }
  .record-card.status-approved{border-color:rgba(82,120,24,.55);}
  .record-card.status-pending{border-color:rgba(224,139,35,.65);}
  .record-card.status-other{border-color:var(--line);}

  .record-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    cursor:pointer;
  }
  .record-plate{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.03em;
  }
  .record-meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .record-description{margin-top:4px;line-height:1.35;}
  .record-badge{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:4px;
    background:var(--paper-alt);
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .record-cost{font-size:13px;font-weight:600;white-space:nowrap;}

  .record-toggles{
    display:flex;
    gap:18px;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .toggle{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12.5px;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .toggle input{width:17px;height:17px;accent-color:var(--green-ink);cursor:pointer;}
  .toggle.on{color:var(--ink);font-weight:600;}

  .bottom-bar{
    position:fixed !important;
    left:0;right:0;bottom:0 !important;top:auto !important;
    width:100%;
    background:var(--panel);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    z-index:1000;
    transform:translateZ(0);
    -webkit-transform:translateZ(0);
    will-change:transform;
  }
  .bottom-mobile-menu{display:none;}
  @media(max-width:639px){
    .bottom-bar{
      grid-template-columns:1fr;
      padding:8px 16px calc(8px + env(safe-area-inset-bottom));
    }
    .bottom-bar > button:not(#btnBottomMenu){display:none;}
    .bottom-bar #btnBottomMenu{
      display:flex;align-items:center;justify-content:center;
      min-height:46px;width:100%;font-size:13px;
    }
  }
  @media(min-width:640px){
    .bottom-bar{grid-template-columns:repeat(4,1fr);}
    .bottom-bar #btnBottomMenu{display:none;}
  }
  .bottom-bar button{
    background:transparent;
    border:1px solid rgba(245,244,238,0.22);
    color:var(--on-panel);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:12px 6px;
    border-radius:8px;
    cursor:pointer;
    line-height:1.3;
  }
  .bottom-bar button:active{background:rgba(245,244,238,0.12);}

  .bottom-mobile-menu{position:fixed;inset:0;z-index:1001;}
  .bottom-mobile-menu.open{display:block;}
  .bottom-mobile-menu-backdrop{position:absolute;left:0;right:0;top:0;bottom:calc(70px + env(safe-area-inset-bottom));background:rgba(22,21,15,0.5);}
  .bottom-mobile-menu-sheet{position:absolute;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--paper);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(22,21,15,0.18);}
  .bottom-mobile-menu-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 12px;border-bottom:1px solid var(--line);margin-bottom:12px;}
  .bottom-mobile-menu-head h3{font-size:19px;margin:0;}
  .bottom-mobile-menu-head button{background:none;border:0;font-size:28px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:2px 6px;}
  .bottom-mobile-menu-list{display:flex;flex-direction:column;gap:8px;}
  .bottom-mobile-menu-list button{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.3;text-transform:uppercase;cursor:pointer;}
  .bottom-mobile-menu-list button:active{background:var(--paper-alt);}

  .overlay{
    position:fixed;inset:0;
    background:rgba(22,21,15,0.5);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  @media(min-width:640px){
    .overlay{align-items:center;}
  }
  @media(max-width:639px){

  .field{margin-top:16px;}

  .sheet-actions{display:flex;gap:10px;margin-top:24px;}

  .confirm-text{font-size:14px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}

  table.report{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}

    font-weight:700;
    padding-top:10px;

  }
  .pill{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    padding:2px 7px;
    border-radius:4px;
    text-transform:uppercase;
  }
  .pill-yes{background:var(--green-bg);color:var(--green-ink);}
  .pill-no{background:var(--red-bg);color:var(--red);}

  .report-controls{display:flex;gap:10px;align-items:center;margin-top:14px;}

  .attention-panel{margin:16px 0 4px;display:none;}
  .attention-panel.show{display:block;}
  .attention-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .attention-title{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .attention-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
  .attention-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;text-align:left;cursor:pointer;min-width:0;}
  .attention-card:hover{border-color:var(--line-strong);}
  .attention-card .attention-label{font-size:10px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;color:var(--ink-soft);}
  .attention-card .attention-value{font-size:20px;font-weight:800;margin-top:3px;}

  .attention-card.attention-alert .attention-value{color:var(--red);}
  .history-button{margin-top:0;padding:6px 9px;border:1px solid var(--line-strong);background:#fff;border-radius:7px;font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;cursor:pointer;}

  .history-stat-label{font-size:10px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;color:var(--ink-soft);}

  .report-controls input{
    padding:9px 10px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;
  }

  .toast{

    color:var(--on-panel);

    border-radius:8px;
    font-size:13px;

async function cfInitSupabase(){
  if (cfSupabase) return cfSupabase;
  if (!window.supabase || !window.supabase.createClient) {
    await new Promise((resolve, reject) => {
      const src = 'https://unpkg.com/@supabase/supabase-js@2';
      const s = document.createElement('script');
      s.src = src; s.async = true; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  if (!window.supabase || !window.supabase.createClient) throw new Error('Nie udało się załadować biblioteki Supabase.');
  cfSupabase = window.supabase.createClient(CF_SUPABASE_URL, CF_SUPABASE_KEY);
  return cfSupabase;
}

// CleanFleet — Web Push / VAPID
// Klucz publiczny jest pobierany bezpośrednio z Edge Function,
// dzięki czemu nie przechowujemy go na stałe w index.html.
const CF_VAPID_KEY_FUNCTION_URL = CF_SUPABASE_URL + '/functions/v1/cleanfleet-vapid-key';
let cfVapidPublicKey = null;
let cfPushRegistration = null;

function cfBase64UrlToUint8Array(base64UrlString){
  const padding = '='.repeat((4 - (base64UrlString.length % 4)) % 4);
  const base64 = (base64UrlString + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
}

async function cfGetVapidPublicKey(){
  if(cfVapidPublicKey) return cfVapidPublicKey;
  const response = await fetch(CF_VAPID_KEY_FUNCTION_URL, {
    method:'GET',
    headers:{ 'apikey': CF_SUPABASE_KEY }
  });
  if(!response.ok) throw new Error('Nie udało się pobrać klucza VAPID ('+response.status+').');
  const data = await response.json();
  const key = data.publicKey || data.vapidPublicKey || data.VAPID_PUBLIC_KEY || data.key;
  if(!key || typeof key !== 'string') throw new Error('Edge Function nie zwróciła klucza publicznego VAPID.');
  cfVapidPublicKey = key;
  return key;
}

async function cfRegisterServiceWorker(){
  if(!('serviceWorker' in navigator)) throw new Error('Ta przeglądarka nie obsługuje Service Workera.');
  cfPushRegistration = await navigator.serviceWorker.register('./sw.js');
  await navigator.serviceWorker.ready;
  return cfPushRegistration;
}

  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function cfSetNotificationsStatus(text, enabled=false){
  const el = document.getElementById('cfNotificationsSub');
  if(el) el.textContent = text;

  if(btn){
    const title = document.getElementById('cfNotificationsTitle');
    if(title) title.textContent = enabled ? 'Wyłącz powiadomienia' : 'Włącz powiadomienia';
  }
}

function cfGetDeviceId(){
  const key = 'cleanfleet-push-device-id';
  let id = localStorage.getItem(key);
  if(!id){
    id = (crypto?.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
    localStorage.setItem(key, id);
  }
  return id;
}

async function cfSavePushSubscription(subscription){
  const session = (await cfSupabase.auth.getSession()).data.session;
  const userId = session?.user?.id;
  if(!userId) throw new Error('Brak zalogowanego użytkownika.');

  const json = subscription.toJSON();
  const endpoint = json.endpoint || subscription.endpoint;
  const p256dh = json.keys?.p256dh || '';
  const auth = json.keys?.auth || '';
  if(!endpoint || !p256dh || !auth) throw new Error('Nie udało się odczytać danych subskrypcji push.');

  const userAgent = navigator.userAgent || '';
  const deviceId = cfGetDeviceId();

  // Najpierw szukamy po stałym identyfikatorze urządzenia. Dzięki temu
  // ponowne włączenie po zmianie endpointu aktualizuje istniejący rekord
  // zamiast tworzyć kolejny. Endpoint pozostaje aktualnym adresem Apple Push.
  const { data: byDevice, error: deviceError } = await cfSupabase
    .from('push_subscriptions')
    .select('id')
    .eq('user_id', userId)
    .eq('device_id', deviceId)
    .limit(1)
    .maybeSingle();
  if(deviceError) throw deviceError;

  if(byDevice?.id){
    const { error } = await cfSupabase.from('push_subscriptions').update({
      endpoint, p256dh, auth, user_agent:userAgent, enabled:true, updated_at:new Date().toISOString()
    }).eq('id', byDevice.id);
    if(error) throw error;
    return;
  }

  // Migracja istniejącego rekordu v40: jeśli endpoint już jest w bazie,
  // przypisujemy mu stały device_id zamiast tworzyć nowy wpis.
  const { data: byEndpoint, error: endpointError } = await cfSupabase
    .from('push_subscriptions')
    .select('id')
    .eq('endpoint', endpoint)
    .limit(1)
    .maybeSingle();
  if(endpointError) throw endpointError;

  if(byEndpoint?.id){
    const { error } = await cfSupabase.from('push_subscriptions').update({
      user_id:userId, device_id:deviceId, p256dh, auth, user_agent:userAgent, enabled:true, updated_at:new Date().toISOString()
    }).eq('id', byEndpoint.id);
    if(error) throw error;
    return;
  }

  const { error } = await cfSupabase.from('push_subscriptions').insert({
    user_id:userId, device_id:deviceId, endpoint, p256dh, auth, user_agent:userAgent, enabled:true
  });
  if(error) throw error;
}

async function cfEnableNotifications(){
  const btn = document.getElementById('cfNotificationsBtn');
  if(btn) btn.disabled = true;
  try{
    if(!('Notification' in window)) throw new Error('Ta przeglądarka nie obsługuje powiadomień.');
    if(!('PushManager' in window)) throw new Error('Ta przeglądarka nie obsługuje powiadomień push.');

    const permission = Notification.permission === 'default'
      ? await Notification.requestPermission()
      : Notification.permission;
    if(permission !== 'granted') throw new Error('Dostęp do powiadomień nie został przyznany.');

    await cfRegisterServiceWorker();
    const vapidKey = await cfGetVapidPublicKey();
    let subscription = await cfPushRegistration.pushManager.getSubscription();
    if(!subscription){
      subscription = await cfPushRegistration.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:cfBase64UrlToUint8Array(vapidKey)
      });
    }
    await cfSavePushSubscription(subscription);
    cfSetNotificationsStatus('Powiadomienia są aktywne na tym urządzeniu.', true);
    cfScheduleWashReminders();
    cfShowToast('Powiadomienia zostały włączone');
  }catch(error){
    console.error('CleanFleet notifications error:', error);
    cfSetNotificationsStatus('Nie udało się włączyć: '+(error?.message || 'nieznany błąd'));
  }finally{
    if(btn) btn.disabled = false;
  }
}

async function cfDisableNotifications(){
  const btn = document.getElementById('cfNotificationsBtn');
  if(btn) btn.disabled = true;
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window)) {
      throw new Error('Ta przeglądarka nie obsługuje powiadomień push.');
    }

    await cfRegisterServiceWorker();
    const subscription = await cfPushRegistration.pushManager.getSubscription();
    if(!subscription){
      cfSetNotificationsStatus('Powiadomienia są wyłączone.', false);
      cfShowToast('Powiadomienia są już wyłączone');
      return;
    }

    const session = (await cfSupabase.auth.getSession()).data.session;
    const userId = session?.user?.id;
    const endpoint = subscription.endpoint;
    const deviceId = cfGetDeviceId();

    if(userId){
      const { error } = await cfSupabase
        .from('push_subscriptions')
        .update({
          enabled:false,
          updated_at:new Date().toISOString()
        })
        .eq('user_id', userId)
        .eq('device_id', deviceId);
      if(error) throw error;
    }

    const unsubscribed = await subscription.unsubscribe();
    if(!unsubscribed) throw new Error('Nie udało się wyłączyć subskrypcji push.');

    cfSetNotificationsStatus('Powiadomienia są wyłączone na tym urządzeniu.', false);
    cfShowToast('Powiadomienia zostały wyłączone');
  }catch(error){
    console.error('CleanFleet notifications disable error:', error);
    cfSetNotificationsStatus('Nie udało się wyłączyć: '+(error?.message || 'nieznany błąd'), true);
  }finally{
    if(btn) btn.disabled = false;
  }
}

async function cfPrepareNotifications(){
  const btn = document.getElementById('cfNotificationsBtn');
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window)){
      cfSetNotificationsStatus('Ta przeglądarka nie obsługuje powiadomień.', false);
      return;
    }
    await cfRegisterServiceWorker();
    const subscription = await cfPushRegistration.pushManager.getSubscription();
    if(!subscription){
      cfSetNotificationsStatus('Powiadomienia są wyłączone na tym urządzeniu.', false);
      return;
    }
    const session = (await cfSupabase.auth.getSession()).data.session;
    if(!session?.user?.id){
      cfSetNotificationsStatus('Zaloguj się, aby zarządzać powiadomieniami.', false);
      return;
    }
    await cfSavePushSubscription(subscription);
    cfSetNotificationsStatus('Powiadomienia są aktywne na tym urządzeniu.', true);
  }catch(error){
    console.warn('CleanFleet notifications prepare:', error);
    cfSetNotificationsStatus('Nie udało się sprawdzić stanu: '+(error?.message || 'nieznany błąd'), false);
  }finally{
    if(btn) btn.disabled = false;
  }
}

<script>
(function(){

  const DEFAULT_OPTIONS = {
    typ: ['SOLÓWKA','ZESTAW','BUS'],
    marka: ['VOLVO','SCANIA','MERCEDES','----'],
    kto_zlecil: ['DANIEL','AGNIESZKA','KRZYSIEK','MICHAŁ'],
    kto_wykonal: ['MICHAŁ']
  };

  // Starter fleet list — from the spreadsheet screenshot. A fuller list will
  // replace/extend this later; this just seeds search so it isn't empty.
  // Vehicle registry + historical records now live in dane.js (window.FLEET_DATA),
  // loaded once into localStorage on first run — not hardcoded here.

  let records = [];
  let registry = {};
  let options = JSON.parse(JSON.stringify(DEFAULT_OPTIONS));
  let editingId = null;
  let invoices = [];
  let invoiceItems = [];
  let mainStatusFilter = 'all';

  // CleanFleet — przypomnienia o zbliżającym się praniu.
  // Dzień wcześniej o 13:00 oraz w dniu prania o 09:00 czasu urządzenia.
  const CF_WASH_REMINDER_LEAD_DAYS = 1;
  const CF_WASH_REMINDER_DAY_BEFORE_HOUR = 13;
  const CF_WASH_REMINDER_SAME_DAY_HOUR = 9;
  const cfWashReminderTimers = new Map();

  function cfReminderKey(r, suffix){
    return `cleanfleet-wash-reminder:${r.id}:${r.data_zlecenia_do}:${suffix}`;
  }

  function cfScheduleWashReminders(){
    for(const timer of cfWashReminderTimers.values()) clearTimeout(timer);
    cfWashReminderTimers.clear();
    if(!('Notification' in window) || Notification.permission !== 'granted') return;

    const now = new Date();

    records.forEach(r => {
      if(!r || !r.zlecone || r.zatwierdzone || r.zaplacone || !r.data_zlecenia_do) return;

      const dueDate = new Date(`${r.data_zlecenia_do}T00:00:00`);
      if(!Number.isFinite(dueDate.getTime())) return;

      const reminders = [
        {
          suffix: 'day-before',
          title: 'Jutro termin prania',
          date: new Date(dueDate)
        },
        {
          suffix: 'same-day',
          title: 'Dzisiaj termin prania',
          date: new Date(dueDate)
        }
      ];

      reminders[0].date.setDate(reminders[0].date.getDate() - CF_WASH_REMINDER_LEAD_DAYS);
      reminders[0].date.setHours(CF_WASH_REMINDER_DAY_BEFORE_HOUR, 0, 0, 0);
      reminders[1].date.setHours(CF_WASH_REMINDER_SAME_DAY_HOUR, 0, 0, 0);

      reminders.forEach(item => {
        if(item.date <= now) return;

        const key = cfReminderKey(r, item.suffix);
        if(localStorage.getItem(key)) return;

        const scheduleAtReminder = () => {
          const remaining = item.date.getTime() - Date.now();
          if(remaining <= 0){
            try{
              const current = records.find(x => x.id === r.id);
              if(!current || !current.zlecone || current.zatwierdzone || current.zaplacone ||
                 current.data_zlecenia_do !== r.data_zlecenia_do) return;

              const n = new Notification(item.title, {
                body: `${current.tablica} — zaplanowane na ${fmtDate(current.data_zlecenia_do)}`,
                tag: `cleanfleet-wash-${current.id}-${item.suffix}`,
                renotify: false
              });

              localStorage.setItem(key, '1');
              n.onclick = () => {
                window.focus();
                try { n.close(); } catch(e) {}
                openForm(current.id);
              };
            }catch(error){
              console.warn('CleanFleet wash reminder:', error);
            }finally{
              cfWashReminderTimers.delete(key);
            }
            return;
          }

          // Safari/iOS ogranicza setTimeout do ok. 24,8 dnia.
          // Dłuższe terminy dzielimy na kolejne odcinki, żeby przypomnienie
          // nie uruchomiło się przed właściwą datą.
          const timer = setTimeout(scheduleAtReminder, Math.min(remaining, 2147483647));
          cfWashReminderTimers.set(key, timer);
        };
        scheduleAtReminder();
      });
    });
  }

  function uid(){
    if(window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
    const bytes = new Uint8Array(16);
    if(window.crypto && typeof window.crypto.getRandomValues === 'function') {
      window.crypto.getRandomValues(bytes);
    } else {
      for(let i=0;i<16;i++) bytes[i] = Math.floor(Math.random()*256);
    }
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    const h = [...bytes].map(b=>b.toString(16).padStart(2,'0')).join('');
    return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }

  async function loadAll(){
    cfSetSync('Pobieranie aktualnych danych…');
    const { data: vehicleRows, error: ve } = await cfSupabase.from('vehicles').select('plate,type,brand').order('plate');
    if(ve){ cfSetSync('Błąd bazy: '+ve.message,'err'); showToast('Nie udało się pobrać pojazdów'); return; }
    const { data: recordRows, error: re } = await cfSupabase.from('wash_records').select('id,plate,type,brand,billing_category,ordered,ordered_by,order_date,order_due_date,notes,wash_date,performed_by,cost,approved,paid,created_at').order('created_at',{ascending:false});
    if(re){ cfSetSync('Błąd bazy: '+re.message,'err'); showToast('Nie udało się pobrać wpisów'); return; }

    registry = {};
    (vehicleRows||[]).forEach(v => { registry[v.plate] = { typ:v.type||'', marka:v.brand||'' }; });
    records = (recordRows||[]).map(cfMapRecord);
    cfRemoteVehiclePlates = new Set((vehicleRows||[]).map(v=>v.plate));
    cfRemoteRecordIds = new Set((recordRows||[]).map(r=>r.id));
    await cfLoadInvoices();
    cfLastSync = new Date();
    localStorage.setItem('cf-last-sync', cfLastSync.toISOString());

  async function saveRecords(){
    const rows = records.map(cfRecordToDb);
    if(rows.length){
      const { error } = await cfSupabase.from('wash_records').upsert(rows, {onConflict:'id'});
      if(error){ showToast('Błąd zapisu wpisów: '+error.message); throw error; }
    }
    const currentIds = new Set(records.map(r=>r.id));
    const removed = [...cfRemoteRecordIds].filter(id=>!currentIds.has(id));
    if(removed.length){
      const { error } = await cfSupabase.from('wash_records').delete().in('id', removed);
      if(error){ showToast('Błąd usuwania wpisów: '+error.message); throw error; }
    }
    cfRemoteRecordIds = currentIds;
    cfLastSync = new Date();
    cfSetSync('Zapisano · '+cfFormatSyncTime(cfLastSync),'ok');
    cfScheduleWashReminders();
  }

  async function cfRetrySupabase(action, attempts=3){
    let lastError = null;
    for(let i=0;i<attempts;i++){
      try{
        const result = await action();
        if(!result?.error) return result;
        lastError = result.error;
      }catch(error){
        lastError = error;
      }
      if(i < attempts-1) await new Promise(resolve => setTimeout(resolve, 700 * (i+1)));
    }
    throw lastError || new Error('Nie udało się wykonać operacji w bazie.');
  }

  async function saveRegistry(changedPlate=null, oldPlate=null){
    try{
      // Przy zwykłym dodawaniu/edycji zapisujemy tylko zmieniony pojazd.
      // Wcześniej każda zmiana wysyłała całą listę pojazdów do Supabase,
      // co na iPadzie/Safari mogło kończyć się błędem „Load failed”.
      if(changedPlate){
        const v = registry[changedPlate] || {typ:'', marka:''};
        await cfRetrySupabase(() => cfSupabase.from('vehicles').upsert({
          plate:changedPlate, type:v.typ||'', brand:v.marka||''
        }, {onConflict:'plate'}));

        if(oldPlate && oldPlate !== changedPlate){
          await cfRetrySupabase(() => cfSupabase.from('vehicles').delete().eq('plate', oldPlate));
          cfRemoteVehiclePlates.delete(oldPlate);
        }
        cfRemoteVehiclePlates.add(changedPlate);
      } else {
        // Import / pełna synchronizacja nadal zapisuje całą listę.
        const rows = Object.entries(registry).map(([plate,v])=>({plate,type:v.typ||'',brand:v.marka||''}));
        if(rows.length){
          await cfRetrySupabase(() => cfSupabase.from('vehicles').upsert(rows, {onConflict:'plate'}));
        }
        const currentPlates = new Set(Object.keys(registry));
        const removed = [...cfRemoteVehiclePlates].filter(plate=>!currentPlates.has(plate));
        if(removed.length){
          await cfRetrySupabase(() => cfSupabase.from('vehicles').delete().in('plate', removed));
        }
        cfRemoteVehiclePlates = currentPlates;
      }
      cfLastSync = new Date();
      cfSetSync('Zapisano · '+cfFormatSyncTime(cfLastSync),'ok');
    }catch(error){
      const message = error?.message || String(error);
      showToast('Błąd zapisu pojazdu: '+message);
      throw error;
    }
  }

  function fmtDate(iso){
    if(!iso) return '—';
    const [y,m,d] = iso.split('-');
    if(!y||!m||!d) return iso;

  function fmtMoney(n){

  function activeRecords(){
    const active = records.filter(r => !r.zaplacone);
    const statusRank = r => r.zatwierdzone ? 1 : (r.zlecone ? 0 : 2);
    return active.sort((a,b) => {
      const rankDiff = statusRank(a) - statusRank(b);
      if(rankDiff !== 0) return rankDiff;
      if(!a.zatwierdzone && a.zlecone && !b.zatwierdzone && b.zlecone){
        return (b.data_zlecenia||'').localeCompare(a.data_zlecenia||'') || (b.created_at-a.created_at);
      }
      if(a.zatwierdzone && b.zatwierdzone){
        return (b.data_prania||'').localeCompare(a.data_prania||'') || (b.created_at-a.created_at);
      }
      return b.created_at-a.created_at;
    });
  }

  function renderRecords(){
    const list = document.getElementById('recordsList');
    let active = activeRecords();
    active = active.filter(r => {
      switch(mainStatusFilter){
        case 'ordered': return r.zlecone;
        case 'todo': return r.zlecone && !r.data_prania;
        case 'done': return !!r.data_prania;
        case 'unapproved': return !!r.data_prania && !r.zatwierdzone && !r.zaplacone;
        case 'unpaid': return !r.zaplacone;
        case 'old': {
          const days = daysSinceLastWashForRecord(r);
          return days !== null && days >= (365 / 2);
        }
        default: return true;
      }
    });
    if(active.length === 0){
      list.innerHTML = `<div class="empty-state">Brak aktywnych wpisów.<br>Wyszukaj tablicę powyżej, aby dodać pranie.</div>`;
      return;

    list.innerHTML = active.map(r => recordCardHtml(r)).join('');

    list.querySelectorAll('[data-open]').forEach(el => {

  function getLastWashForPlate(plate, currentId){
    return records
      .filter(x => x.id !== currentId && x.tablica === plate && x.data_prania)

  function lastWashDaysBadgeHtml(r){
    const last = r.data_prania ? r : getLastWashForPlate(r.tablica, r.id);
    if(!last || !last.data_prania) return '';
    const t = new Date(last.data_prania+'T00:00:00').getTime();
    if(!Number.isFinite(t)) return '';
    const days = Math.max(0, Math.floor((Date.now() - t) / 86400000));
    const cls = days >= (365 / 2) ? 'record-old-days overdue' : 'record-old-days recent';
    return `<span class="${cls}" title="Dni od ostatniego prania">${days} dni</span>`;
  }

  function daysSinceLastWashForRecord(r){
    const last = r.data_prania ? r : getLastWashForPlate(r.tablica, r.id);
    if(!last || !last.data_prania) return null;
    const t = new Date(last.data_prania+'T00:00:00').getTime();
    if(!Number.isFinite(t)) return null;
    return Math.floor((Date.now()-t)/86400000);
  }

  async function submitForm(){
    const plate = document.getElementById('f_tablica').value.trim().toUpperCase();
    const typ = document.getElementById('f_typ').value.trim();
    const marka = document.getElementById('f_marka').value.trim();
    const zlecone = document.getElementById('f_zlecone').checked;
    const kto_zlecil = document.getElementById('f_kto_zlecil').value.trim();
    const data_zlecenia = document.getElementById('f_data_zlecenia').value;
    const data_zlecenia_do = document.getElementById('f_data_zlecenia_do')?.value || '';
    const uwagi = document.getElementById('f_uwagi').value.trim();
    const data_prania = document.getElementById('f_data_prania').value;
    const kto_wykonal = document.getElementById('f_kto_wykonal').value.trim();
    const koszt = parseFloat(document.getElementById('f_koszt').value) || 0;
    const billing_category = document.getElementById('f_grupa_rozliczeniowa')?.value || null;

    if(!plate){ showToast('Podaj numer tablicy'); return; }

    addOptionIfNew('typ', typ);
    addOptionIfNew('marka', marka);
    addOptionIfNew('kto_zlecil', kto_zlecil);
    addOptionIfNew('kto_wykonal', kto_wykonal);

    const oldPlate = editingId ? (records.find(x => x.id === editingId)?.tablica || '') : '';
    const previousRegistryValue = registry[plate] ? { ...registry[plate] } : null;
    registry[plate] = { typ, marka };
    try{
      await saveRegistry(plate, oldPlate);
    }catch(error){
      if(oldPlate && oldPlate !== plate){
        delete registry[plate];
        registry[oldPlate] = previousRegistryValue || { typ:'', marka:'' };
      } else if(previousRegistryValue){
        registry[plate] = previousRegistryValue;
      } else {
        delete registry[plate];
      }
      return;
    }

    if(editingId){
      const rec = records.find(x => x.id === editingId);
      Object.assign(rec, { tablica: plate, typ, marka, billing_category, zlecone, kto_zlecil, data_zlecenia, data_zlecenia_do, uwagi, data_prania, kto_wykonal, koszt });
    } else {
      records.push({
        id: uid(),
        tablica: plate,
        typ, marka, billing_category, zlecone, kto_zlecil, data_zlecenia, data_zlecenia_do, uwagi, data_prania, kto_wykonal, koszt,
        zatwierdzone: false,
        zaplacone: false,
        created_at: Date.now()
      });
    }
    const wasEditing = !!editingId;
    await saveRecords();
    closeModal();
    renderAttentionPanel();
    renderRecords();
    showToast(wasEditing ? 'Zapisano zmiany' : 'Dodano wpis');
  }

  function normalizePlate(s){
    return (s||'').toUpperCase().replace(/[\s-]/g, '');
  }

  function doSearch(){
    const raw = document.getElementById('searchInput').value.trim();
    if(!raw){ showToast('Wpisz tablicę, markę, typ, osobę lub numer faktury'); return; }
    const queryPlate = normalizePlate(raw);
    const queryText = raw.toLowerCase();
    const invoiceNumbersByPlate = {};
    invoiceItems.forEach(item => {
      const inv = invoices.find(i => i.id === item.invoice_id);
      if(inv && item.plate) (invoiceNumbersByPlate[item.plate] ||= []).push(String(inv.invoice_number||''));
    });
    const matches = Object.keys(registry).filter(plate => {
      const info = registry[plate] || {};
      const plateHit = normalizePlate(plate).includes(queryPlate);
      const vehicleText = [info.typ, info.marka].join(' ').toLowerCase();
      const recordText = records.filter(r=>r.tablica===plate).map(r=>[r.typ,r.marka,r.uwagi,r.kto_zlecil,r.kto_wykonal,r.data_zlecenia,r.data_zlecenia_do,r.data_prania].join(' ')).join(' ').toLowerCase();
      const invoiceText = (invoiceNumbersByPlate[plate]||[]).join(' ').toLowerCase();
      return plateHit || vehicleText.includes(queryText) || recordText.includes(queryText) || invoiceText.includes(queryText);
    }).sort((a,b)=>{
      const ah=normalizePlate(a).startsWith(queryPlate), bh=normalizePlate(b).startsWith(queryPlate);
      return Number(bh)-Number(ah) || a.localeCompare(b);
    });
    const directPlateMatch = Object.keys(registry).some(plate => normalizePlate(plate).includes(queryPlate));
    showSearchResults(raw.toUpperCase(), matches, directPlateMatch);
  }

  function lastApprovedRecordFor(plate){
    const approved = records.filter(r => r.tablica === plate && r.zatwierdzone)
      .sort((a,b) => (b.data_prania||'').localeCompare(a.data_prania||'') || b.created_at - a.created_at);
    return approved[0] || null;
  }

  function showSearchResults(query, matches, canAddNew=true){
    const rowsHtml = matches.map(plate => {
      const info = registry[plate] || {};
      const history = records
        .filter(r => r.tablica === plate)
        .sort((a,b) => (b.data_prania||'').localeCompare(a.data_prania||'') || b.created_at - a.created_at);

      // Każde pranie jest osobnym wpisem. Wyszukanie pojazdu pokazuje więc
      // całą jego historię, a nie tylko ostatni rekord.
      const historyHtml = history.length
        ? history.map((r, idx) => {
            const pending = !r.data_prania;
            const label = pending
              ? `Oczekuje na wykonanie${r.zatwierdzone ? ' · zatwierdzone' : ''}`
              : `Pranie: ${fmtDate(r.data_prania)} · wykonał: ${escapeHtml(r.kto_wykonal||'—')}`;
            const border = pending ? 'border-left:4px solid var(--orange);' : 'border-left:4px solid var(--green);';
            return `<div class="record-card search-history-item" data-pick-id="${escapeHtml(r.id)}" style="cursor:pointer;${border}margin-top:8px;">
              <div class="record-top">
                <div>
                  <div class="record-meta"><strong>${label}</strong></div>
                  <div class="record-meta">${escapeHtml(r.uwagi||'—')}</div>
                </div>
                <div style="text-align:right;white-space:nowrap;">${fmtMoney(r.koszt)}</div>
              </div>
            </div>`;
          }).join('')
        : `<div class="confirm-text" style="margin-top:8px;">Brak historii prania — można utworzyć pierwszy wpis.</div>`;

      return `
        <div class="record-card" style="margin-bottom:10px;">
          <div class="record-top">
            <div>
              <div class="record-plate">${escapeHtml(plate)}</div>
              <div class="record-meta">${escapeHtml(info.typ||'—')} · ${escapeHtml(info.marka||'—')}</div>
              <button type="button" class="history-button" data-history-plate="${escapeHtml(plate)}">Otwórz historię</button>
            </div>
          </div>
          <div style="margin-top:8px;">
            ${historyHtml}
          </div>
        </div>`;
    }).join('');

    const body = matches.length
      ? `<div class="confirm-text">Znaleziono ${matches.length} ${matches.length===1?'pojazd':'pojazdów'} pasujących do „${escapeHtml(query)}”:</div>
         <div class="records" style="margin-top:12px;">${rowsHtml}</div>
         ${canAddNew ? `<div class="sheet-actions">
           <button class="btn btn-outline" id="addNewAnyway">To nowy pojazd — dodaj „${escapeHtml(query)}”</button>
         </div>` : ''}`
      : `<div class="confirm-text">Nie znaleziono pojazdu pasującego do „${escapeHtml(query)}” na liście. Zostanie dodany jako nowy.</div>
         <div class="sheet-actions">
           <button class="btn btn-solid" id="addNewAnyway" style="flex:none;width:100%;">Dodaj nowy pojazd: ${escapeHtml(query)}</button>
         </div>`;

    reportShell('Wynik wyszukiwania', '', body);
    document.getElementById('searchInput').value = '';

    document.querySelectorAll('[data-history-plate]').forEach(el => {
      el.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); showVehicleHistory(el.getAttribute('data-history-plate')); });
    });
    document.querySelectorAll('[data-pick-id]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-pick-id');
        const rec = records.find(r => r.id === id);
        closeModal();
        if(rec && !rec.data_prania){
          // Niedokończony wpis — edycja istniejącego rekordu.
          openForm(rec.id);
        } else {
          // Wpis zakończony datą prania — nowe pranie, nigdy edycja starego.
          window.__pendingPlate = rec ? rec.tablica : '';
          openForm(null);
        }
      });
    });
    const addBtn = document.getElementById('addNewAnyway');
    if(addBtn){
      addBtn.addEventListener('click', () => {
        closeModal();
        window.__pendingPlate = query;
        openForm(null);
      });
    }
  }

  function showVehicleHistory(plate, onBack){
    const info = registry[plate] || {};
    const rows = records.filter(r=>r.tablica===plate).sort((a,b)=> (b.data_prania||b.data_zlecenia||'').localeCompare(a.data_prania||a.data_zlecenia||'') || b.created_at-a.created_at);
    const washed = rows.filter(r=>r.data_prania);
    const total = washed.reduce((s,r)=>s+Number(r.koszt||0),0);
    const last = washed[0] || null;
    const days = last ? Math.max(0,Math.floor((Date.now()-new Date(last.data_prania+'T00:00:00').getTime())/86400000)) : null;
    const historyRows = rows.length ? rows.map(r=>`<tr>
      <td>${r.data_prania?fmtDate(r.data_prania):'—'}</td><td>${escapeHtml(r.typ||'—')}</td><td>${escapeHtml(r.kto_wykonal||'—')}</td><td>${fmtMoney(r.koszt)}</td><td>${r.zlecone?'ZLECONE':'—'}</td>
    </tr>`).join('') : '<tr><td colspan="5">Brak historii.</td></tr>';
    const body=`<div class="confirm-text"><strong>${escapeHtml(plate)}</strong> · ${escapeHtml(info.typ||'—')} · ${escapeHtml(info.marka||'—')}</div>
      <div class="history-summary">
        <div class="history-stat"><div class="history-stat-label">Prań</div><div class="history-stat-value">${washed.length}</div></div>
        <div class="history-stat"><div class="history-stat-label">Przychód</div><div class="history-stat-value">${fmtMoney(total)}</div></div>
        <div class="history-stat"><div class="history-stat-label">Ostatnie pranie</div><div class="history-stat-value">${days===null?'—':days+' dni'}</div></div>
      </div>
      <table class="report"><thead><tr><th>Data prania</th><th>Typ</th><th>Wykonał</th><th>Kwota</th><th>Status</th></tr></thead><tbody>${historyRows}</tbody></table>`;
    reportShell('Historia samochodu', '', body);

    // Powrót zależny od miejsca, z którego otwarto historię.
    if(onBack){
      const backBtn = document.createElement('button');
      backBtn.type = 'button';
      backBtn.className = 'btn btn-outline';
      backBtn.textContent = 'Wróć';
      backBtn.style.marginTop = '12px';
      backBtn.addEventListener('click', onBack);

      const reportContent = document.querySelector('#modalRoot .sheet, #modalRoot .report-shell');
      if(reportContent){
        reportContent.appendChild(backBtn);
      }
    }
  }

  function renderAttentionPanel(){
    const panel=document.getElementById('attentionPanel');
    if(!panel) return;
    const pendingOrders=records.filter(r=>r.zlecone && !r.data_prania).length;
    const unpaidInvoices=invoices.filter(i=>i.status!=='paid').length;
    const oldVehicles=Object.keys(registry).filter(plate=>{
      const latest=records.filter(r=>r.tablica===plate && r.data_prania).sort((a,b)=>(b.data_prania||'').localeCompare(a.data_prania||''))[0];
      // „Dawno nie prane” tylko wtedy, gdy znana jest data ostatniego prania,
      // minęło co najmniej 182,5 dnia (365/2), a pojazd NIE jest typu BUS.
      // BUS jest celowo wyłączony zarówno z listy, jak i z licznika kafelka.
      const info=registry[plate] || {};
      const vehicleType=String((latest && latest.typ) || info.typ || '').trim().toUpperCase();
      if(vehicleType==='BUS') return false;
      if(!latest) return false;
      return daysSinceLastWashForRecord(latest)>=(365/2);
    }).length;
    const unapproved=records.filter(r=>r.data_prania && !r.zatwierdzone && !r.zaplacone).length;
    const items=[
      {label:'Do wykonania',value:pendingOrders,filter:'todo',alert:pendingOrders>0},
      {label:'Dawno nie prane',value:oldVehicles,action:'old',alert:oldVehicles>0},
      {label:'Niezatwierdzone',value:unapproved,filter:'unapproved',alert:unapproved>0},
      {label:'Faktury do zapłaty',value:unpaidInvoices,action:'finance',alert:unpaidInvoices>0}
    ];
    if(!items.some(x=>x.value>0)){ panel.classList.remove('show'); panel.innerHTML=''; return; }
    panel.classList.add('show');
    panel.innerHTML=`<div class="attention-head"><div class="attention-title">Wymaga uwagi</div></div><div class="attention-grid">${items.map((x,i)=>`<button type="button" class="attention-card ${x.alert?'attention-alert':''}" data-attention-index="${i}"><div class="attention-label">${x.label}</div><div class="attention-value">${x.value}</div></button>`).join('')}</div>`;
    panel.querySelectorAll('[data-attention-index]').forEach(btn=>btn.addEventListener('click',()=>{
      const item=items[Number(btn.dataset.attentionIndex)];
      if(item.action==='finance') showFinanceQueue();
      else if(item.action==='old') showOldVehicles();
      else { mainStatusFilter=item.filter; const sel=document.getElementById('mainStatusFilter'); if(sel) sel.value=item.filter; renderRecords(); document.getElementById('recordsList')?.scrollIntoView({behavior:'smooth',block:'start'}); }
    }));
  }

  // --- Rozliczenia / faktury ---
  async function cfLoadInvoices(){
    invoices = [];
    invoiceItems = [];
    if(!cfSupabase) return;
    try{
      const {data:{session}} = await cfSupabase.auth.getSession();
      if(!session) return;
      const {data: inv, error: ie} = await cfSupabase
        .from('invoices')
        .select('id,invoice_number,invoice_date,period,amount,status,paid_at,created_at')
        .order('created_at',{ascending:false});
      if(ie){
        console.warn('CleanFleet invoices unavailable:', ie.message);
        return;
      }
      invoices = inv || [];
      if(invoices.length){
        const ids = invoices.map(x=>x.id);
        const {data: items, error: ii} = await cfSupabase
          .from('invoice_items')
          .select('id,invoice_id,wash_record_id,plate,cost')
          .in('invoice_id', ids);
        if(!ii) invoiceItems = items || [];
      }
    }catch(e){
      console.warn('CleanFleet invoice load error:', e);
    }
  }

  async function cfCreateInvoiceFromRows(invoiceNumber, period, rows){
    const {data:{session}} = await cfSupabase.auth.getSession();
    if(!session?.user?.id) throw new Error('Brak zalogowanego użytkownika.');
    const amount = rows.reduce((sum,r)=>sum+(Number(r.koszt)||0),0);
    const existing = invoices.find(i => i.invoice_number === invoiceNumber);
    if(existing){
      return {existing:true, invoice:existing};
    }
    const {data: invoice, error: ie} = await cfSupabase.from('invoices').insert({
      user_id: session.user.id,
      invoice_number: invoiceNumber,
      invoice_date: todayISO(),
      period,
      amount,
      status:'pending'
    }).select('id,invoice_number,invoice_date,period,amount,status,paid_at,created_at').single();
    if(ie) throw new Error('Nie udało się zapisać faktury: '+ie.message);

    const itemRows = rows.map(r=>({
      invoice_id: invoice.id,
      wash_record_id: r.id,
      plate: r.tablica,
      cost: Number(r.koszt)||0
    }));
    if(itemRows.length){
      const {error: ii} = await cfSupabase.from('invoice_items').insert(itemRows);
      if(ii){
        await cfSupabase.from('invoices').delete().eq('id',invoice.id);
        throw new Error('Nie udało się przypisać pojazdów do faktury: '+ii.message);
      }
    }
    invoices.unshift(invoice);
    invoiceItems.push(...itemRows.map((x,i)=>({...x,id: invoice.id+'-'+i})));
    return {existing:false, invoice};
  }

  function invoiceRowsFor(invoiceId){
    const ids = new Set(invoiceItems.filter(x=>x.invoice_id===invoiceId).map(x=>x.wash_record_id));
    return records.filter(r=>ids.has(r.id));
  }

  async function cfMarkInvoicePaid(invoiceId){
    const invoice = invoices.find(i=>i.id===invoiceId);
    if(!invoice) return;
    const rows = invoiceRowsFor(invoiceId);
    const ids = rows.map(r=>r.id);
    if(ids.length){
      const {error} = await cfSupabase.from('wash_records').update({paid:true}).in('id',ids);
      if(error) throw new Error('Nie udało się oznaczyć pojazdów jako zapłacone: '+error.message);
      rows.forEach(r=>r.zaplacone=true);
    }
    const paidAt = new Date().toISOString();
    const {error: ie} = await cfSupabase.from('invoices').update({status:'paid',paid_at:paidAt}).eq('id',invoiceId);
    if(ie) throw new Error('Nie udało się oznaczyć faktury jako opłaconej: '+ie.message);
    invoice.status='paid'; invoice.paid_at=paidAt;
    await saveRecords();
  }

  function showFinanceQueue(){
    menuOverlay.classList.remove('open');

    const renderInvoiceRows = (list) => {
      if(!list.length){
        return '<div class="empty-state" style="margin-top:14px;">Brak faktur w kolejce oczekujących płatności.</div>';
      }
      return list.map(inv=>{
        const count = invoiceItems.filter(x=>x.invoice_id===inv.id).length;
        const paid = inv.status === 'paid';
        return `<div class="invoice-row" data-invoice-open="${escapeHtml(inv.id)}">
          <div class="invoice-row-top">
            <div>
              <div class="invoice-number">${escapeHtml(inv.invoice_number)}</div>
              <div class="invoice-meta">${inv.invoice_date ? fmtDate(inv.invoice_date) : '—'} · ${count} pojazdów · ${fmtMoney(inv.amount)}</div>
            </div>
            <span class="invoice-status ${paid?'invoice-paid':'invoice-pending'}">${paid?'OPŁACONA':'OCZEKUJE'}</span>
          </div>
        </div>`;
      }).join('');
    };

    const sorted = [...invoices].sort((a,b)=>{
      if(a.status !== b.status) return a.status === 'paid' ? 1 : -1;
      return String(b.invoice_date||b.created_at||'').localeCompare(String(a.invoice_date||a.created_at||''));
    });

    const pending=sorted.filter(i=>i.status!=='paid');
    const pendingAmount=pending.reduce((s,i)=>s+Number(i.amount||0),0);
    const paidAmount=sorted.filter(i=>i.status==='paid').reduce((s,i)=>s+Number(i.amount||0),0);
    const body = `<div class="confirm-text">Tutaj znajdują się faktury zapisane przy generowaniu załącznika. Otwórz fakturę, aby zobaczyć przypisane pojazdy i oznaczyć całą fakturę jako opłaconą.</div>
      <div class="finance-queue-summary">
        <div class="finance-queue-card"><div class="q-label">Oczekujące</div><div class="q-value">${pending.length}</div></div>
        <div class="finance-queue-card"><div class="q-label">Do zapłaty</div><div class="q-value">${fmtMoney(pendingAmount)}</div></div>
        <div class="finance-queue-card"><div class="q-label">Opłacone</div><div class="q-value">${fmtMoney(paidAmount)}</div></div>
      </div>
      <div id="financeQueueList">${renderInvoiceRows(sorted)}</div>`;

    reportShell('Rozliczenia / oczekujące płatności', '', body);

    document.querySelectorAll('#financeQueueList [data-invoice-open]').forEach(el=>{
      el.addEventListener('click',()=>showInvoiceDetails(el.getAttribute('data-invoice-open')));
    });
  }

  function showInvoiceDetails(invoiceId){
    const inv = invoices.find(i=>i.id===invoiceId);
    if(!inv) return;
    const rows = invoiceRowsFor(invoiceId);
    const body = rows.length ? rows.map(r=>`<tr>
      <td class="mono">${escapeHtml(r.tablica)}</td>
      <td>${escapeHtml(r.typ||'—')}</td>
      <td>${fmtDate(r.data_prania)}</td>
      <td>${fmtMoney(r.koszt)}</td>
      <td><span class="pill ${r.zaplacone?'pill-yes':'pill-no'}">${r.zaplacone?'TAK':'NIE'}</span></td>
    </tr>`).join('') : '<tr><td colspan="5">Brak przypisanych wpisów.</td></tr>';
    const paid = inv.status==='paid';
    const bodyHtml = `<div class="confirm-text">Faktura <strong>${escapeHtml(inv.invoice_number)}</strong> · ${fmtMoney(inv.amount)} · ${rows.length} pojazdów</div>
      <table class="report"><thead><tr><th>Tablica</th><th>Typ</th><th>Data prania</th><th>Kwota</th><th>Zapł.</th></tr></thead><tbody>${body}</tbody></table>
      <div class="sheet-actions">
        ${paid ? '<button class="btn btn-solid" disabled>✓ Faktura opłacona</button>' : '<button class="btn btn-solid" id="markInvoicePaidBtn">Faktura opłacona</button>'}
        <button class="btn btn-outline" id="deleteInvoiceBtn" title="Usuń fakturę" aria-label="Usuń fakturę" style="background:#c62828;color:#fff;border-color:#c62828;font-size:20px;line-height:1;min-width:48px;padding:10px 14px;">🗑️</button>
        <button class="btn btn-outline" id="backFinanceBtn">Wróć</button>
      </div>`;
    reportShell('Szczegóły faktury', '', bodyHtml);
    document.getElementById('backFinanceBtn').addEventListener('click', showFinanceQueue);

    document.getElementById('deleteInvoiceBtn').addEventListener('click',()=>{
      showConfirm(
        'Usunąć fakturę z kolejki?',
        `Faktura ${escapeHtml(inv.invoice_number)} oraz jej przypisania do pojazdów zostaną usunięte z rozliczeń. Wpisy prania pozostaną w bazie.`,
        async()=>{
          try{
            const {error:itemError}=await cfSupabase.from('invoice_items').delete().eq('invoice_id', invoiceId);
            if(itemError) throw itemError;
            const {error:invoiceError}=await cfSupabase.from('invoices').delete().eq('id', invoiceId);
            if(invoiceError) throw invoiceError;

            await cfLoadInvoices();
            showToast('Faktura usunięta z kolejki płatności');
            showFinanceQueue();

  function cfInvoiceNumberCandidates(text){
    const normalized = String(text || '').replace(/\u00a0/g,' ').replace(/\r/g,'\n');
    const patterns = [
      /(?:faktura\s*(?:vat|nr|numer)?|nr\s*faktury|numer\s*faktury)\s*[:#]?\s*([A-Z]{0,5}\s*[A-Z0-9._\/-]{2,30})/ig,
      /\b(?:FV|FVS|FS|FA|FVT)[\s\/._-]*[A-Z0-9]{1,10}(?:[\s\/._-]+[A-Z0-9]{1,15}){0,5}\b/ig
    ];
    const found = [];
    patterns.forEach((p, idx) => {
      let m;
      while((m=p.exec(normalized))){
        const value = (idx===0 ? m[1] : m[0]).trim().replace(/\s+/g,' ');
        if(value && !found.includes(value)) found.push(value);
      }
    });
    return found;
  }

  async function cfExtractPdfText(file){
    if(!file) return '';
    const arrayBuffer = await file.arrayBuffer();
    const pdfjs = window.pdfjsLib;
    if(!pdfjs) return '';
    const pdf = await pdfjs.getDocument({data:arrayBuffer}).promise;
    let text = '';
    const maxPages = Math.min(pdf.numPages, 8);
    for(let pageNo=1; pageNo<=maxPages; pageNo++){
      const page = await pdf.getPage(pageNo);
      const content = await page.getTextContent();
      text += content.items.map(item=>item.str || '').join(' ') + '\n';
    }
    return text;
  }

  async function cfReadInvoiceFile(file){
    cfInvoiceAttachment = file;
    cfInvoiceNumberDetected = '';
    const status = document.getElementById('invoiceReadStatus');
    if(status) status.textContent = 'Analizuję fakturę…';
    try{
      const extracted = await cfExtractPdfText(file);
      const candidates = cfInvoiceNumberCandidates(extracted);
      if(candidates.length){
        cfInvoiceNumberDetected = candidates[0];
        if(status) status.textContent = `Odczytano numer faktury: ${cfInvoiceNumberDetected}`;
      }else{
        if(status) status.textContent = 'Nie udało się automatycznie odczytać numeru. Możesz wpisać go ręcznie.';
      }
    }catch(err){
      console.error('CleanFleet invoice PDF read error:', err);
      if(status) status.textContent = 'Nie udało się odczytać tekstu faktury. Numer można wpisać ręcznie.';
    }
  }

  function pdfBillingCategoryKey(r){
    const c = String(r?.billing_category || '').trim().toLowerCase();
    if(c === 'osobowe') return 'personal';
    if(c === 'ciezarowe' || c === 'ciężarowe') return 'heavy';
    if(c === 'busy' || c === 'bus') return 'bus';

    // Backward compatibility for old records without billing_category.
    const t = String(r?.typ || '').trim().toUpperCase();
    if(t.includes('BUS')) return 'bus';
    if(t === 'OSOBOWY' || t === 'OSOBOWE' || t.includes('OSOBOW')) return 'personal';
    return 'heavy';
  }

  function pdfBillingCategory(r){
    const key = pdfBillingCategoryKey(r);
    if(key === 'personal') return 'Osobowe';

  async function generateMonthPdf(){
    if(!window.jspdf || !window.html2canvas){
      showToast('Nie udało się wczytać generatora PDF — sprawdź połączenie z internetem');
      return;
    }

    const val = document.getElementById('pdfMonthPicker').value;
    const invoiceNumber = document.getElementById('pdfInvoiceNumber').value.trim();
    if(!val){ showToast('Wybierz miesiąc'); return; }
    if(!invoiceNumber){
      showToast('Nie udało się odczytać numeru faktury. Wpisz go ręcznie.');
      document.getElementById('pdfInvoiceNumber').focus();
      return;
    }
    if(!cfInvoiceAttachment){
      showToast('Najpierw załącz fakturę PDF.');
      return;
    }

    const selectedCols = Array.from(document.querySelectorAll('.pdf-col-check:checked')).map(el=>el.value);
    if(!selectedCols.length){ showToast('Wybierz co najmniej jedną kolumnę'); return; }

    const selectedVehicleTypes = Array.from(document.querySelectorAll('.pdf-type-check:checked')).map(el=>el.value);
    if(!selectedVehicleTypes.length){ showToast('Wybierz co najmniej jeden typ pojazdu'); return; }

    const noSummary = document.getElementById('pdfNoSummary').checked;
    const selectedSummaryTypes = noSummary ? [] : Array.from(document.querySelectorAll('.pdf-summary-type:checked')).map(el=>el.value);
    if(!noSummary && !selectedSummaryTypes.length){
      showToast('Wybierz typ podsumowania albo zaznacz „Bez podsumowania”');
      return;
    }

    const rows = records
      .filter(r=>r.zatwierdzone && r.data_prania && r.data_prania.slice(0,7)===val)
      .filter(r=>selectedVehicleTypes.includes(pdfBillingCategoryKey(r)))
      .sort((a,b)=>a.data_prania.localeCompare(b.data_prania));

    if(!rows.length){
      showToast('Brak zatwierdzonych prań dla wybranych ustawień');
      return;
    }

    const activeCols = PDF_COLUMNS.filter(c=>selectedCols.includes(c.key));
    showToast('Generuję raport PDF…');

    const headerCells = activeCols.map(c=>`<th style="text-align:left;padding:8px 10px;background:#16150F;color:#F5F4EE;font-size:13px;">${escapeHtml(colDefs[c.key].header)}</th>`).join('');
    const includeServiceDescription = document.getElementById('pdfIncludeServiceDescription')?.checked;
    const bodyRows = rows.map((r,i)=>`
      <tr style="background:${i%2?'#F7F6F1':'#FFFFFF'};">
        ${activeCols.map(c=>`<td style="padding:7px 10px;font-size:12.5px;border-bottom:1px solid #E5E3D8;">${escapeHtml(String(colDefs[c.key].cell(r)))}</td>`).join('')}
        ${includeServiceDescription?`<td style="padding:7px 10px;font-size:12.5px;border-bottom:1px solid #E5E3D8;">${escapeHtml(pdfServiceDescription(r))}</td>`:''}
      </tr>`).join('');

    let sumHtml='';
    if(!noSummary){
      const summaryLabels={personal:'Osobowe',heavy:'Ciężarowe',bus:'Busy'};
      const summaryLines=selectedSummaryTypes.map(type=>{
        const total=rows.filter(r=>pdfBillingCategoryKey(r)===type).reduce((sum,r)=>sum+(Number(r.koszt)||0),0);
        return `<div style="display:flex;justify-content:space-between;gap:20px;margin-top:5px;"><span>${summaryLabels[type]}</span><span>${fmtMoney(total)}</span></div>`;
      }).join('');
      sumHtml=`<div style="margin-top:18px;font-size:14px;font-weight:700;border-top:1px solid #D9D6C9;padding-top:10px;">${summaryLines}</div>`;
    }

    const logoImg=document.querySelector('.app-logo');
    const logoSrc=logoImg?logoImg.src:'';
    const container=document.createElement('div');
    container.style.cssText='position:fixed;left:-9999px;top:0;width:900px;background:#ffffff;color:#16150F;font-family:Arial,Helvetica,sans-serif;padding:32px;';
    container.innerHTML=`
      <div style="margin-bottom:22px;">
        ${logoSrc?`<img src="${logoSrc}" style="height:58px;width:auto;display:block;margin-bottom:18px;">`:''}
        <div style="font-size:17px;font-weight:700;line-height:1.35;">Załącznik do faktury</div>
        <div style="font-size:16px;margin-top:3px;">${escapeHtml(invoiceNumber)}</div>
      </div>
      <table style="width:100%;border-collapse:collapse;">
        <thead><tr>${headerCells}${includeServiceDescription?'<th style="text-align:left;padding:8px 10px;background:#16150F;color:#F5F4EE;font-size:13px;">Opis usługi</th>':''}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
      ${sumHtml}`;
    document.body.appendChild(container);

    let canvas;
    try{
      canvas=await html2canvas(container,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    }catch(e){
      document.body.removeChild(container);
      showToast('Nie udało się wygenerować PDF');
      return;
    }
    document.body.removeChild(container);

    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:'mm',format:'a4'});
    const marginMM=10, imgWidthMM=190, pageHeightMM=277;
    const pxPerMM=canvas.width/imgWidthMM, pageHeightPx=pageHeightMM*pxPerMM;
    let renderedPx=0, firstPage=true;
    while(renderedPx<canvas.height){
      const sliceHeightPx=Math.min(pageHeightPx,canvas.height-renderedPx);
      const sliceCanvas=document.createElement('canvas');
      sliceCanvas.width=canvas.width; sliceCanvas.height=sliceHeightPx;
      sliceCanvas.getContext('2d').drawImage(canvas,0,renderedPx,canvas.width,sliceHeightPx,0,0,canvas.width,sliceHeightPx);
      if(!firstPage) doc.addPage();
      doc.addImage(sliceCanvas.toDataURL('image/png'),'PNG',marginMM,marginMM,imgWidthMM,sliceHeightPx/pxPerMM);
      renderedPx+=sliceHeightPx; firstPage=false;
    }

    const safeInvoice=invoiceNumber.replace(/[^a-zA-Z0-9._-]+/g,'_');
    const filename=`zalacznik-do-faktury-${safeInvoice}-${val}.pdf`;
    const blob=doc.output('blob');
    showPdfPreview(blob,filename,{invoiceNumber,period:val,rows,invoiceFile:cfInvoiceAttachment});
  }

  // --- Supabase: pobieranie całej tabeli stronicami ---
  // Supabase/PostgREST może zwracać maksymalnie ograniczoną liczbę rekordów
  // w jednym żądaniu. Eksport musi więc pobrać dane partiami.
  async function cfFetchAllRows(tableName, orderColumn){
    if(!cfSupabase) throw new Error('Supabase nie jest jeszcze gotowe.');

    const pageSize = 1000;
    const allRows = [];
    let from = 0;

    while(true){
      let query = cfSupabase.from(tableName).select('*');
      if(orderColumn) query = query.order(orderColumn, {ascending:true, nullsFirst:false});

      const {data, error} = await query.range(from, from + pageSize - 1);
      if(error) throw new Error(`Nie udało się pobrać tabeli ${tableName}: ${error.message}`);

      const rows = Array.isArray(data) ? data : [];
      allRows.push(...rows);

      if(rows.length < pageSize) break;
      from += pageSize;
    }

    return allRows;
  }

  // --- Excel export: all vehicles + all wash records ---
  function cfExcelCellValue(value){
    if(value === null || value === undefined) return '';
    if(typeof value === 'object') return JSON.stringify(value);
    return value;
  }

  function cfRowsToExcel(rows){
    return (rows || []).map(row => {
      const out = {};
      Object.entries(row || {}).forEach(([key,value]) => {
        out[key] = cfExcelCellValue(value);
      });
      return out;
    });
  }

  async function cfExportExcel(){
    const btn = document.getElementById('exportExcelBtn');
    if(btn) btn.disabled = true;
    try{
      if(typeof XLSX === 'undefined') throw new Error('Moduł Excel nie został załadowany.');
      cfSetSync('Przygotowywanie pełnego backupu…');
      const [{ data:{session} }, vehicles, washRecords, invoiceRows, invoiceItemRows] = await Promise.all([
        cfSupabase.auth.getSession(),
        cfFetchAllRows('vehicles', 'plate'),
        cfFetchAllRows('wash_records', 'created_at'),
        cfFetchAllRows('invoices', 'created_at'),
        cfFetchAllRows('invoice_items', 'id')
      ]);
      const wb = XLSX.utils.book_new();
      const append = (name, rows, empty=['Brak rekordów']) => {
        const safe = cfRowsToExcel(rows);
        const ws = safe.length ? XLSX.utils.json_to_sheet(safe) : XLSX.utils.aoa_to_sheet([empty]);
        XLSX.utils.book_append_sheet(wb, ws, name);
        return ws;
      };
      const wsVehicles=append('Pojazdy',vehicles);
      const wsWash=append('Wpisy_prania',washRecords);
      const wsInvoices=append('Faktury',invoiceRows);
      const wsItems=append('Pozycje_faktur',invoiceItemRows);
      const backupInfo=[
        ['CleanFleet — pełny backup bazy'],
        ['Format','CleanFleet Backup v2'],
        ['Data eksportu',new Date().toISOString()],
        ['Użytkownik',session?.user?.email||''],
        ['Liczba pojazdów',vehicles.length],
        ['Liczba wpisów prania',washRecords.length],
        ['Liczba faktur',invoiceRows.length],
        ['Liczba pozycji faktur',invoiceItemRows.length],
        ['Uwaga','Ten plik można przywrócić w CleanFleet.']
      ];
      const wsInfo=XLSX.utils.aoa_to_sheet(backupInfo);
      XLSX.utils.book_append_sheet(wb,wsInfo,'Informacje');
      const settingsRows=[['Opcje aplikacji',JSON.stringify(options)]];
      const wsSettings=XLSX.utils.aoa_to_sheet(settingsRows);
      XLSX.utils.book_append_sheet(wb,wsSettings,'Ustawienia');
      [wsVehicles,wsWash,wsInvoices,wsItems,wsInfo,wsSettings].forEach(ws=>{
        const range=ws['!ref']?XLSX.utils.decode_range(ws['!ref']):null; if(!range) return;
        const widths=[];
        for(let c=range.s.c;c<=range.e.c;c++){
          let max=10;
          for(let r=range.s.r;r<=range.e.r;r++){
            const cell=ws[XLSX.utils.encode_cell({r,c})];
            if(cell&&cell.v!==undefined) max=Math.max(max,String(cell.v).length);
            if(max>=60){max=60;break;}
          }
          widths[c]={wch:Math.min(Math.max(max+2,12),60)};
        }
        ws['!cols']=widths;
      });
      const stamp=new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
      XLSX.writeFile(wb,`CleanFleet-backup-${stamp}.xlsx`);
      cfSetSync(`Backup gotowy · ${vehicles.length} pojazdów · ${washRecords.length} wpisów · ${invoiceRows.length} faktur`,'ok');
      showToast('Utworzono pełny backup CleanFleet');
      menuOverlay.classList.remove('open');
    }catch(error){
      console.error('CleanFleet backup export error:',error);
      cfSetSync('Błąd eksportu backupu','err');
      showToast('Nie udało się utworzyć backupu: '+(error?.message||'nieznany błąd'));
    }finally{ if(btn) btn.disabled=false; }
  }

  function cfSheetObjects(wb,name){
    const sheet=wb.Sheets[name];
    if(!sheet) return [];
    return XLSX.utils.sheet_to_json(sheet,{defval:''});
  }
  function cfIsFullBackupWorkbook(wb){
    const names=wb.SheetNames||[];
    return names.includes('Pojazdy') && names.includes('Wpisy_prania') && names.includes('Faktury') && names.includes('Pozycje_faktur');
  }
  function cfNormalizeBackupRow(row){
    const out={};
    Object.entries(row||{}).forEach(([k,v])=>{ out[k]=v===undefined||v===null?'':v; });
    return out;
  }
  const CF_BACKUP_COLUMNS={
    vehicles:['plate','type','brand'],
    wash_records:['id','plate','type','brand','billing_category','ordered','ordered_by','order_date','order_due_date','notes','wash_date','performed_by','cost','approved','paid','created_at'],
    invoices:['id','user_id','invoice_number','invoice_date','period','amount','status','paid_at','created_at'],
    invoice_items:['id','invoice_id','wash_record_id','plate','cost']
  };
  function cfPickColumns(row,cols){
    const out={}; cols.forEach(k=>{ if(Object.prototype.hasOwnProperty.call(row,k)) out[k]=row[k]; }); return out;
  }
  function cfCoerceBool(v){ return v===true || v===1 || String(v).toLowerCase()==='true' || String(v)==='1'; }
  function cfCoerceNumber(v){ const n=Number(v); return Number.isFinite(n)?n:0; }
  function cfPrepareBackupData(wb){
    const vehicles=cfSheetObjects(wb,'Pojazdy').map(r=>cfPickColumns(cfNormalizeBackupRow(r),CF_BACKUP_COLUMNS.vehicles)).filter(r=>r.plate);
    const wash_records=cfSheetObjects(wb,'Wpisy_prania').map(r=>{
      const x=cfPickColumns(cfNormalizeBackupRow(r),CF_BACKUP_COLUMNS.wash_records);
      ['ordered','approved','paid'].forEach(k=>x[k]=cfCoerceBool(x[k])); x.cost=cfCoerceNumber(x.cost); return x;
    }).filter(r=>r.id&&r.plate);
    const invoices=cfSheetObjects(wb,'Faktury').map(r=>{ const x=cfPickColumns(cfNormalizeBackupRow(r),CF_BACKUP_COLUMNS.invoices); x.amount=cfCoerceNumber(x.amount); return x; }).filter(r=>r.id&&r.invoice_number);
    const invoice_items=cfSheetObjects(wb,'Pozycje_faktur').map(r=>{ const x=cfPickColumns(cfNormalizeBackupRow(r),CF_BACKUP_COLUMNS.invoice_items); x.cost=cfCoerceNumber(x.cost); return x; }).filter(r=>r.invoice_id);
    let backupOptions=null;
    const settings=cfSheetObjects(wb,'Ustawienia');
    if(settings[0]?.['Opcje aplikacji']){ try{ backupOptions=JSON.parse(settings[0]['Opcje aplikacji']); }catch(e){} }
    return {vehicles,wash_records,invoices,invoice_items,backupOptions};
  }
  async function cfBatch(table,rows,mode='upsert'){
    const batchSize=300;
    for(let i=0;i<rows.length;i+=batchSize){
      const chunk=rows.slice(i,i+batchSize); if(!chunk.length) continue;
      let result;
      if(mode==='upsert') result=await cfSupabase.from(table).upsert(chunk,{onConflict: table==='vehicles'?'plate':'id'});
      else result=await cfSupabase.from(table).insert(chunk);
      if(result.error) throw new Error(`Tabela ${table}: ${result.error.message}`);
    }
  }
  async function cfDeleteAllVisible(table,key,rows){
    const vals=rows.map(r=>r[key]).filter(v=>v!==undefined&&v!==null&&v!=='');
    const batchSize=300;
    for(let i=0;i<vals.length;i+=batchSize){
      const chunk=vals.slice(i,i+batchSize); if(!chunk.length) continue;
      const {error}=await cfSupabase.from(table).delete().in(key,chunk);
      if(error) throw new Error(`Nie udało się wyczyścić ${table}: ${error.message}`);
    }
  }
  async function cfRestoreFullBackup(data,mode){
    const session=(await cfSupabase.auth.getSession()).data.session;
    const userId=session?.user?.id; if(!userId) throw new Error('Brak zalogowanego użytkownika.');
    if(mode==='replace'){
      const [items,inv,recordsNow,vehiclesNow]=await Promise.all([
        cfFetchAllRows('invoice_items','id'),cfFetchAllRows('invoices','created_at'),cfFetchAllRows('wash_records','created_at'),cfFetchAllRows('vehicles','plate')
      ]);
      await cfDeleteAllVisible('invoice_items','id',items);
      await cfDeleteAllVisible('invoices','id',inv);
      await cfDeleteAllVisible('wash_records','id',recordsNow);
      await cfDeleteAllVisible('vehicles','plate',vehiclesNow);
    }
    await cfBatch('vehicles',data.vehicles,'upsert');
    await cfBatch('wash_records',data.wash_records,'upsert');
    const invoiceRows=data.invoices.map(x=>({...x,user_id:userId}));
    await cfBatch('invoices',invoiceRows,'upsert');
    await cfBatch('invoice_items',data.invoice_items,'upsert');
    if(data.backupOptions && typeof data.backupOptions==='object'){
      options={...options,...data.backupOptions}; saveOptions();
    }
    await loadAll();
  }

  // Istniejących tablic NIE modyfikujemy. Nowe tablice dostają pojazd + historyczny wpis prania.
  function cfNormalizeImportedDate(value){
    if(value === null || value === undefined || value === '') return '';
    if(value instanceof Date && !isNaN(value.getTime())){
      return value.toISOString().slice(0,10);
    }
    if(typeof value === 'number' && typeof XLSX !== 'undefined' && XLSX.SSF){
      const parsed = XLSX.SSF.parse_date_code(value);
      if(parsed && parsed.y && parsed.m && parsed.d){
        return `${String(parsed.y).padStart(4,'0')}-${String(parsed.m).padStart(2,'0')}-${String(parsed.d).padStart(2,'0')}`;
      }
    }
    const raw = String(value).trim();
    let m = raw.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/);
    if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    m = raw.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);
    if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
    return '';
  }

  function cfExtractFleetUpdateRows(rawRows){
    if(!rawRows || !rawRows.length) return [];
    const header = rawRows[0].map(h => String(h ?? '').trim().toLowerCase());
    const idxPlate = header.findIndex(h => h === 'tablica' || h.includes('tablic') || h === 'plate' || h.includes('rejestrac'));
    const idxWash = header.findIndex(h => h === 'data prania' || h.includes('data prania') || h === 'wash_date');
    const idxWho = header.findIndex(h => h === 'kto prał' || h === 'kto pral' || h.includes('kto pra') || h === 'performed_by');

    if(idxPlate < 0 || idxWash < 0 || idxWho < 0){
      throw new Error('Plik musi mieć kolumny: Tablica, Data prania, Kto prał.');
    }

    const result = [];
    const seen = new Set();

    for(let i=1;i<rawRows.length;i++){
      const row = rawRows[i] || [];
      const plate = normalizePlate(String(row[idxPlate] ?? '').trim());
      if(!plate || seen.has(plate)) continue;
      seen.add(plate);
      result.push({
        plate,
        wash_date: cfNormalizeImportedDate(row[idxWash]),
        performed_by: String(row[idxWho] ?? '').trim()
      });
    }
    return result;
  }

  async function runFleetUpdate(rows, selectedType, selectedBilling){
    if(!rows.length){ closeModal(); return; }

    try{
      // Aktualizacja floty działa na CAŁEJ liście z importu:
      // - nowa tablica -> dodaj,
      // - istniejąca tablica -> nie dodawaj ponownie,
      // - wybrany typ -> ustaw dla wszystkich importowanych tablic,
      // - wybrana grupa rozliczeniowa -> ustaw dla wpisów prania tych tablic,
      // - puste wybory -> nie zmieniaj odpowiedniego pola.
      const { data: currentVehicles, error: vehicleError } =
        await cfSupabase.from('vehicles').select('plate,type,brand');
      if(vehicleError) throw vehicleError;

      const existing = new Set((currentVehicles || []).map(v => normalizePlate(v.plate)));
      const importedPlates = [...new Set(rows.map(r => normalizePlate(r.plate)).filter(Boolean))];
      const newRows = rows.filter(r => !existing.has(r.plate));

      // 1. Dodaj tylko brakujące pojazdy.
      if(newRows.length){
        const vehicleRows = newRows.map(r => ({
          plate:r.plate,
          type:selectedType || '',
          brand:''
        }));
        const { error: insertVehicleError } =
          await cfSupabase.from('vehicles').insert(vehicleRows);
        if(insertVehicleError) throw insertVehicleError;
      }

      // 2. Jeżeli wybrano typ, ustaw go dla WSZYSTKICH pojazdów z importowanej listy.
      // Dotyczy również pojazdów, które już były w bazie — właśnie po to służy
      // wybór typu podczas aktualizacji floty.
      if(selectedType && importedPlates.length){
        const { error: updateVehicleTypeError } =
          await cfSupabase.from('vehicles')
            .update({type:selectedType})
            .in('plate', importedPlates);
        if(updateVehicleTypeError) throw updateVehicleTypeError;

        // Synchronizujemy również typ w istniejących wpisach prania.
        // Dzięki temu statystyki i historia dla importowanej grupy są spójne.
        const { data: recordsToUpdate, error: recordsReadError } =
          await cfSupabase.from('wash_records')
            .select('id,plate')
            .in('plate', importedPlates);
        if(recordsReadError) throw recordsReadError;

        for(const record of (recordsToUpdate || [])){
          const { error: updateRecordTypeError } =
            await cfSupabase.from('wash_records')
              .update({type:selectedType})
              .eq('id', record.id);
          if(updateRecordTypeError) throw updateRecordTypeError;
        }
      }

      // 3. Jeżeli wybrano grupę rozliczeniową, ustaw ją dla istniejących
      // wpisów prania wszystkich importowanych tablic.
      // Pusta grupa = nie zmieniamy istniejących grup.
      if(selectedBilling && importedPlates.length){
        const { error: updateBillingError } =
          await cfSupabase.from('wash_records')
            .update({billing_category:selectedBilling})
            .in('plate', importedPlates);
        if(updateBillingError) throw updateBillingError;
      }

      // 4. Dla nowych pojazdów utwórz historię tylko wtedy, gdy XLS ma datę prania.
      const washRows = newRows
        .filter(r => r.wash_date)
        .map(r => ({
          id: uid(),
          plate: r.plate,
          type: selectedType || '',
          brand: '',
          billing_category: selectedBilling || null,
          ordered: false,
          ordered_by: '',
          order_date: null,
          order_due_date: null,
          notes: 'Import z pliku floty',
          wash_date: r.wash_date,
          performed_by: r.performed_by || '',
          cost: 0,
          approved: true,
          paid: true,
          created_at: new Date().toISOString()
        }));

      if(washRows.length){
        const { error: insertWashError } =
          await cfSupabase.from('wash_records').insert(washRows);
        if(insertWashError){
          await cfSupabase.from('vehicles').delete().in('plate', newRows.map(r => r.plate));
          throw insertWashError;
        }
      }

      // Aktualizacja lokalnego rejestru po pomyślnym zapisie.
      importedPlates.forEach(plate => {
        const info = registry[plate] || {};
        registry[plate] = {
          typ: selectedType || info.typ || '',
          marka: info.marka || ''
        };
      });

      closeModal();
      await loadAll();

      const updatedExisting = importedPlates.filter(p => existing.has(p)).length;
      const parts = [];
      if(newRows.length) parts.push(`dodano ${newRows.length}`);
      if(updatedExisting && selectedType) parts.push(`typ zaktualizowano w ${updatedExisting}`);
      if(updatedExisting && selectedBilling) parts.push(`grupę rozliczeniową zaktualizowano w ${updatedExisting}`);
      showToast(parts.length ? parts.join(', ') : 'Nie wybrano pól do aktualizacji');
    }catch(error){
      console.error('CleanFleet fleet update error:', error);
      showToast(error?.message || 'Nie udało się zaktualizować bazy pojazdów');
    }
  }
