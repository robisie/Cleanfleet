  async function runImport(mode){
    const rows = pendingImportRows;
    pendingImportRows = null;
    if(!rows){ closeModal(); return; }

    let added = 0, updated = 0;
    const newRegistry = mode === 'replace' ? {} : registry;

    rows.forEach(row => {
      const plate = normalizePlate(row.tablica);
      if(!plate) return;
      if(newRegistry[plate]) updated++; else added++;
      newRegistry[plate] = {
        typ: row.typ || (newRegistry[plate] && newRegistry[plate].typ) || '',
        marka: row.marka || (newRegistry[plate] && newRegistry[plate].marka) || ''
      };
    });

    registry = newRegistry;
    await saveRegistry();
    renderPlateList();
    renderAttentionPanel();
    closeModal();
    menuOverlay.classList.remove('open');
    const modeLabel = mode === 'replace' ? 'Lista zastąpiona' : 'Zaimportowano';
    showToast(`${modeLabel}: ${added} nowych, ${updated} zaktualizowanych`);
  }

  function csvToRows(text){
    const delim = text.indexOf(';') > -1 && text.indexOf(';') < (text.indexOf(',') === -1 ? Infinity : text.indexOf(',')) ? ';' : ',';
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
    return lines.map(line => line.split(delim).map(c => c.trim().replace(/^"|"$/g, '')));
  }

  function extractVehicleRows(rawRows){
    if(!rawRows || rawRows.length === 0) return [];
    const header = (rawRows[0] || []).map(h => String(h||'').toUpperCase().trim());
    const idxTablica = header.findIndex(h => h.includes('TABLIC') || h.includes('PLATE') || h.includes('REJESTRAC'));
    const idxTyp = header.findIndex(h => h === 'TYP' || h.includes('TYPE'));
    const idxMarka = header.findIndex(h => h.includes('MARKA') || h.includes('BRAND'));

    const hasHeader = idxTablica > -1;
    const startRow = hasHeader ? 1 : 0;
    const tablicaCol = hasHeader ? idxTablica : 0;
    const typCol = hasHeader ? idxTyp : 1;
    const markaCol = hasHeader ? idxMarka : 2;

    const rows = [];
    for(let i = startRow; i < rawRows.length; i++){
      const cells = rawRows[i] || [];
      const tablica = String(cells[tablicaCol] || '').trim();
      if(!tablica) continue;
      rows.push({
        tablica: tablica.toUpperCase(),
        typ: String(typCol > -1 ? (cells[typCol] || '') : '').toUpperCase().trim(),
        marka: String(markaCol > -1 ? (cells[markaCol] || '') : '').toUpperCase().trim()
      });
    }
    return rows;
  }

  document.getElementById('cfLoginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email=document.getElementById('cfEmail').value.trim();
    const password=document.getElementById('cfPassword').value;
    await cfSignIn(email,password);
  });
  document.getElementById('cfRefreshBtn').addEventListener('click', cfRefresh);
  document.getElementById('cfNotificationsBtn').addEventListener('click', async ()=>{
    try{
      if(!('serviceWorker' in navigator) || !('PushManager' in window)) {
        await cfEnableNotifications();
        return;
      }
      await cfRegisterServiceWorker();
      const subscription = await cfPushRegistration.pushManager.getSubscription();
      if(subscription) await cfDisableNotifications();
      else await cfEnableNotifications();
    }catch(error){
      console.error('CleanFleet notifications toggle error:', error);
      cfSetNotificationsStatus('Nie udało się zmienić ustawienia: '+(error?.message || 'nieznany błąd'));
    }
  });

  async function cfBoot(){
    cfSetSync('Ładowanie połączenia z bazą…');
    try {
      await cfInitSupabase();
      const { data:{session} } = await cfSupabase.auth.getSession();
      if(!session){ cfShowLogin(true); cfSetSync('Wymagane logowanie'); }
      else { cfShowLogin(false); await loadAll(); await cfPrepareNotifications(); }
      cfSupabase.auth.onAuthStateChange((_event, session)=>{
        if(session){
          cfShowLogin(false);
          setTimeout(async ()=>{ await loadAll(); await cfPrepareNotifications(); },0);
        } else {
          cfShowLogin(true);
          cfSetSync('Wymagane logowanie');
        }
      });
    } catch (err) {
      console.error('CleanFleet Supabase init error:', err);
      cfSetSync('Nie udało się połączyć z bazą','err');
      showToast('Nie udało się załadować połączenia z Supabase. Odśwież stronę.');
    }
  }

  // Po powrocie do aplikacji ponownie wyliczamy terminy. Ma to znaczenie na
  // iPadzie/iPhonie, gdzie Safari może wstrzymać timery w tle.
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') cfScheduleWashReminders();
  });
  window.addEventListener('focus', () => cfScheduleWashReminders());

  function defaultBillingCategory(type){
    const t = String(type || '').trim().toLowerCase();
    if(!t) return '';
    if(t.includes('bus')) return 'busy';
    if(t.includes('osob')) return 'osobowe';
    if(t.includes('zestaw') || t.includes('cięż') || t.includes('cież') ||
       t.includes('ciezar') || t.includes('dostaw')) return 'ciezarowe';
    return '';
  }

  const billingType = document.getElementById('f_typ');
  const billingCategory = document.getElementById('f_grupa_rozliczeniowa');
  if(billingType && billingCategory){
    billingType.addEventListener('change', () => {
      if(!billingCategory.value || billingCategory.dataset.autoDefault === '1'){
        billingCategory.value = defaultBillingCategory(billingType.value);
        billingCategory.dataset.autoDefault = '1';
      }
    });
  }


  function pdfBillingCategory(rec){
    const c = String(rec?.billing_category || '').toLowerCase();
    if(c === 'ciezarowe') return 'Ciężarowe';
    if(c === 'busy') return 'Busy';
    if(c === 'osobowe') return 'Osobowe';
    return pdfVehicleType(rec?.typ);
  }

  function pdfServiceDescription(rec){
    const amount = Number(rec?.koszt || 0);
    return amount >= 400
      ? 'usługa czyszczenia i prania wnętrza'
      : 'usługa dodatkowa';
  }

  document.getElementById('btnMonth').addEventListener('click', showMonthReport);
  document.getElementById('btnYear').addEventListener('click', showYearReport);
  document.getElementById('btnAll').addEventListener('click', showAllOutstanding);

  // Na telefonie cztery dolne akcje są dostępne z jednego menu.
  const bottomMobileMenu = document.getElementById('bottomMobileMenu');
  const btnBottomMenu = document.getElementById('btnBottomMenu');
  const closeBottomMenu = document.getElementById('closeBottomMenu');
  const bottomMobileMenuBackdrop = document.getElementById('bottomMobileMenuBackdrop');
  const closeBottomMobileMenu = () => {
    bottomMobileMenu?.classList.remove('open');
    bottomMobileMenu?.setAttribute('aria-hidden','true');
    btnBottomMenu?.setAttribute('aria-expanded','false');
  };
  btnBottomMenu?.addEventListener('click', () => {
    bottomMobileMenu?.classList.add('open');
    bottomMobileMenu?.setAttribute('aria-hidden','false');
    btnBottomMenu?.setAttribute('aria-expanded','true');
  });
  closeBottomMenu?.addEventListener('click', closeBottomMobileMenu);
  bottomMobileMenuBackdrop?.addEventListener('click', closeBottomMobileMenu);
  bottomMobileMenu?.querySelectorAll('[data-bottom-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.bottomAction;
      closeBottomMobileMenu();
      if(action === 'month') showMonthReport();
      else if(action === 'year') showYearReport();
      else if(action === 'all') showAllOutstanding();
      else if(action === 'pending') showPendingOrders();
    });
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeBottomMobileMenu(); });

  cfBoot();
})();
</script>

</body>
</html>
