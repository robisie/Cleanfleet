<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CleanFleet — naprawa aplikacji</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f3;color:#171a18;display:grid;min-height:100vh;place-items:center}
main{width:min(520px,calc(100% - 32px));background:#fff;border:1px solid #e2e7e2;border-radius:18px;padding:28px;box-shadow:0 14px 40px rgba(25,35,30,.10);text-align:center}
h1{font-size:24px;margin:0 0 10px}p{color:#65706a;line-height:1.5}.bar{height:8px;background:#edf1ec;border-radius:999px;overflow:hidden;margin:20px 0}.bar i{display:block;height:100%;width:30%;background:#97b90d;border-radius:999px;animation:a 1.1s infinite alternate}@keyframes a{to{transform:translateX(230%)}}button{border:0;border-radius:12px;padding:12px 18px;background:#97b90d;font-weight:800;font-size:16px}
</style>
</head>
<body>
<main>
<h1>Naprawiam CleanFleet</h1>
<p id="status">Usuwam starą wersję aplikacji i Service Workera…</p>
<div class="bar"><i></i></div>
<button id="retry" hidden>Otwórz aplikację</button>
</main>
<script>
(async()=>{
 const status=document.getElementById('status'),retry=document.getElementById('retry');
 try{
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.filter(r=>String(r.scope||'').includes('/app/')).map(r=>r.unregister()));
   }
   if('caches' in window){
     const keys=await caches.keys();
     await Promise.all(keys.map(k=>caches.delete(k)));
   }
   status.textContent='Gotowe. Otwieram świeżą wersję CleanFleet…';
   setTimeout(()=>location.replace('/app/?cfRecovery='+Date.now()),500);
 }catch(err){
   console.error(err);
   status.textContent='Automatyczne czyszczenie nie powiodło się. Naciśnij przycisk poniżej.';
   retry.hidden=false;
   retry.onclick=()=>location.replace('/app/?cfRecovery='+Date.now());
 }
})();
</script>
</body>
</html>
